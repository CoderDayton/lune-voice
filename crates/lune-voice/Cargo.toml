[package]
name = "lune-voice"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Local native backends, compiled into the shipped binary by `cgs build`.
# Off by default so routine checks need no C++ toolchain. The `-cuda` variants
# source-compile CUDA kernels (need nvcc); `gpu` is the umbrella `cgs build`
# enables when the build host has a CUDA toolchain.
whisper-cpp = ["lune-asr/whisper-cpp"]
whisper-cuda = ["whisper-cpp", "lune-asr/whisper-cuda"]
whisper-vulkan = ["whisper-cpp", "lune-asr/whisper-vulkan"]
gpu = ["whisper-cuda"]

[dependencies]
lune-core.workspace = true
lune-audio.workspace = true
lune-asr.workspace = true
lune-llm.workspace = true
lune-dict.workspace = true
lune-persist.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
serde_json.workspace = true
arboard.workspace = true
enigo.workspace = true
# Output sound cues (src/sound.rs): decode embedded WAVs and play via cpal.
hound.workspace = true
cpal.workspace = true

# Foreground-window capture (src/focus/windows.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
evdev.workspace = true
wayland-client = { workspace = true }
wayland-protocols-wlr = { workspace = true }
wayland-protocols = { workspace = true }
wayland-scanner = { workspace = true }
wayland-backend = { workspace = true }

# IBus input-method delivery backend (src/ibus.rs) — Linux only. Windows/macOS
# use the arboard+enigo path and must not pull D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }
# X11 reachability probe (src/compositor.rs). Pure Rust, and it performs the
# full setup exchange — including the Xauthority handshake GDK would do.
x11rb = "0.14"

[dev-dependencies]
tempfile.workspace = true
# `test-util` gives paused-time tests, so the terminal-send timeout can be
# exercised without a real 5 s wait.
tokio = { workspace = true, features = ["test-util"] }
# Benchmark harness only (benchmarks/bench_utils.rs), never the library.
tracing-subscriber.workspace = true

# `posix_fadvise(DONTNEED)` in the model_load benchmark: evicts a model file
# from the page cache without root, so a cold load can actually be timed.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

# ── Benchmarks (benchmarks/*.rs, restored for the whisper.cpp stack) ──
# Each needs `whisper-cpp` for the real ASR. Build/run with, e.g.:
#   cargo run --release --example asr_probe -p lune-voice --features "whisper-cpp" -- <wav>

[[example]]
name = "asr_probe"
path = "../../benchmarks/tools/asr_probe.rs"
required-features = ["whisper-cpp"]

[[example]]
name = "live_transcribe"
path = "../../benchmarks/tools/live_transcribe.rs"
