[package]
name = "lune-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Core
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

# Audio capture
cpal = "0.17"

# Resampling (adaptive rate conversion)
rubato = "1.0"
audioadapter-buffers = "2.0"

# Lock-free ring buffer
crossbeam-channel = "0.5"

# Voice activity detection (TEN VAD ONNX model)
ten-vad-rs = "0.1.6"

# Serialization (adaptive VAD state persistence)
serde = { workspace = true, features = ["derive"] }

# Zero-alloc segment boundary list (almost always 0 or 1 per push)
smallvec = { workspace = true }

# Error handling
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"
hound = "3.5"
serde_json.workspace = true

[[example]]
name = "live_capture"
path = "examples/live_capture.rs"

[[example]]
name = "vad_inspect"
path = "examples/vad_inspect.rs"
