[package]
name = "lune-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Core
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

# Audio capture
cpal.workspace = true

# Resampling (adaptive rate conversion)
rubato.workspace = true
audioadapter-buffers.workspace = true

# Lock-free ring buffer
crossbeam-channel = "0.5"

# Error handling
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }
pulseaudio.workspace = true
futures-executor.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true
hound.workspace = true
# Per-frame speech probability, used by the `agc_bench` and `vad_inspect`
# examples as a measuring probe. The shipped pipeline uses whisper's Silero
# VAD, which reports segments rather than a per-frame score.
earshot = "1.1"
