[package]
name = "lune-dict"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["dictionary"]
# User dictionary (DictionaryManager) — pulls lune-persist (SQLite). On by
# default; lune-llm opts out, needing only the lexical tables, not the DB.
dictionary = ["dep:lune-persist"]
[dependencies]
bincode = { version = "2", features = ["serde"] }
lune-core.workspace = true
lune-persist = { workspace = true, optional = true }
serde.workspace = true
tracing.workspace = true
# Core dependency: the corrector and lexicon call wordnik_list::word_exists on
# the always-compiled path (not training-only), so it stays unconditional.
wordnik_list = "0.2"

[build-dependencies]
bincode = { version = "2", features = ["serde"] }
serde.workspace = true

[[bench]]
name = "corrector_bench"
harness = false
