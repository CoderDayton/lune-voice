[package]
name = "lune-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Direct path dep (not workspace-inherited) so default-features can be disabled:
# lune-llm needs only the lexical tables (caprate), not the dictionary DB / SQLite.
lune-dict = { path = "../lune-dict", default-features = false }
async-trait.workspace = true
lune-core.workspace = true
tokio.workspace = true
tracing.workspace = true
async-openai.workspace = true
# Must stay on async-openai's reqwest major, because the client we build here is
# handed to `Client::with_http_client` — a version mismatch would be a type
# mismatch. As of async-openai 0.41 that is the workspace's 0.13.
reqwest = { workspace = true }
url.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1.11"

[dev-dependencies]
tracing-subscriber = "0.3"
tracing = { workspace = true }
