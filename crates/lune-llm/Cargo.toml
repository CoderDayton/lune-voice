[package]
name = "lune-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Local llama.cpp styling LLM. Compiles llama.cpp (C++) via llama-cpp-2-sys —
# needs cmake + a C++ toolchain. Off by default so routine checks stay fast.
llama-cpp = ["dep:llama-cpp-2", "dep:encoding_rs"]
# GPU llama.cpp (source-compiles CUDA kernels; needs the CUDA toolkit).
llama-cuda = ["llama-cpp", "llama-cpp-2/cuda"]

[dependencies]
# Direct path dep (not workspace-inherited) so default-features can be disabled:
# lune-llm needs only the lexical tables (caprate), not the dictionary DB / SQLite.
lune-dict = { path = "../lune-dict", default-features = false }
async-trait.workspace = true
lune-core.workspace = true
tokio.workspace = true
tracing.workspace = true
async-openai.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1.11"
text-processing-rs = "0.1.0"
rand = "0.9"
llama-cpp-2 = { version = "0.1.150", optional = true }
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
tracing = { workspace = true }
