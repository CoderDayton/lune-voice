[package]
name = "lune-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Direct path dep (not workspace-inherited) so default-features can be disabled:
# lune-llm needs only the lexical tables (caprate), not the dictionary DB / SQLite.
lune-dict = { path = "../lune-dict", default-features = false }
async-trait.workspace = true
lune-core.workspace = true
tokio.workspace = true
tracing.workspace = true
async-openai.workspace = true
# Pinned to async-openai's reqwest major (NOT the workspace's 0.13) because the
# client we build here is handed to `Client::with_http_client` — a version
# mismatch would be a type mismatch. Features come from the rest of the graph;
# building a client needs none of them.
reqwest = { version = "0.12", default-features = false }
url.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1.11"
text-processing-rs = "0.1.0"
rand = "0.9"

[dev-dependencies]
tracing-subscriber = "0.3"
tracing = { workspace = true }
