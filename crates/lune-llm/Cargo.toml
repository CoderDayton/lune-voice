[package]
name = "lune-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Direct path dep (not workspace-inherited) so default-features can be disabled:
# lune-llm needs only the lexical tables (caprate), not the dictionary DB / SQLite.
lune-dict = { path = "../lune-dict", default-features = false }
async-trait.workspace = true
lune-core.workspace = true
tokio.workspace = true
tracing.workspace = true
async-openai.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1.11"
text-processing-rs = "0.1.0"
rand = "0.9"

[dev-dependencies]
tracing-subscriber = "0.3"
tracing = { workspace = true }
