[package]
name = "lune-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
lune-core.workspace = true
tracing.workspace = true
async-openai.workspace = true
# Must stay on async-openai's reqwest major, because the client we build here is
# handed to `Client::with_http_client` — a version mismatch would be a type
# mismatch. As of async-openai 0.41 that is the workspace's 0.13.
reqwest = { workspace = true }
url.workspace = true
serde_json.workspace = true
# `RemoteService` (backend/openai.rs): the tower `Service` async-openai's
# `middleware` feature executes requests through, the retry sleep, and the
# `http::Response` a capped body is rebuilt into. All three are already in the
# tree via async-openai and reqwest.
tower = { version = "0.5", default-features = false }
tokio.workspace = true
http = "1"
