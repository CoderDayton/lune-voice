[package]
name = "lune-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
lune-core.workspace = true
tracing.workspace = true
async-openai.workspace = true
# Must stay on async-openai's reqwest major, because the client we build here is
# handed to `Client::with_http_client` — a version mismatch would be a type
# mismatch. As of async-openai 0.41 that is the workspace's 0.13.
reqwest = { workspace = true }
url.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
