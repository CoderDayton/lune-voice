[package]
name = "lune-persist"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lune-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
dirs.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
hf-hub.workspace = true
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
ureq = { version = "3.3.0", features = ["json"] }
sha2 = "0.11"
# Fetching + unpacking the optional GPU backend archive (src/gpu_plugin.rs).
reqwest = { workspace = true }
futures-util = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# `spawn_blocking`, so unpacking the archive does not stall the async runtime
# the Tauri command is awaited on.
tokio = { workspace = true }
# OS keyring for API-key storage (Secret Service on Linux via zbus, Credential
# Manager on Windows, Keychain on macOS). `crypto-rust` keeps the Secret
# Service session encryption pure-Rust — no OpenSSL system dependency.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
url = { workspace = true }
