[package]
name = "lune-persist"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lune-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
dirs.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
# No code references it: declaring it with `bundled` is what makes diesel link
# the vendored SQLite amalgamation instead of a system libsqlite3.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
sha2.workspace = true
hex.workspace = true
# One HTTP stack for model downloads (src/hub.rs, blocking client) and the
# optional GPU backend archive (src/gpu_plugin.rs, async client).
reqwest = { workspace = true, features = ["blocking"] }
futures-util = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# `spawn_blocking`, so unpacking the archive does not stall the async runtime
# the Tauri command is awaited on.
tokio = { workspace = true }
# OS keyring for API-key storage (Secret Service on Linux via zbus, Credential
# Manager on Windows, Keychain on macOS). `crypto-rust` keeps the Secret
# Service session encryption pure-Rust — no OpenSSL system dependency.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
url.workspace = true
