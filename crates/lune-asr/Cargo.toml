[package]
name = "lune-asr"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cuda = ["ort/cuda"]

[dependencies]
async-trait.workspace = true
lune-core.workspace = true
tokio.workspace = true
tracing.workspace = true
ort.workspace = true
half = "2"
ndarray.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
reqwest.workspace = true
url.workspace = true
# tokenizers is used unconditionally by the Nemotron reranker and
# optionally by the OrtQwen ASR path — dropped to an unconditional dep so
# both paths can share the same BPE loader.
tokenizers = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
hound = "3.5"
