[package]
name = "lune-asr"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# whisper-cpp is OFF by default so routine `cargo check`/clippy/test stay fast
# and need no C++ toolchain (the backend falls back to a stub). It is compiled
# into the shipped binary by `cgs build`, which passes `--features whisper-cpp`.
default = []
# Local whisper.cpp backend. Compiles whisper.cpp (C++) via whisper-rs-sys —
# needs cmake + a C++ toolchain + libclang at build time. Disable with
# --no-default-features for a fast ONNX-only build.
whisper-cpp = ["dep:whisper-rs"]
# GPU whisper.cpp. Source-compiles whisper.cpp with CUDA, which additionally
# needs the CUDA toolkit (nvcc). Deliberately separate from `cuda` (which only
# toggles ONNX Runtime's prebuilt CUDA execution provider, no compiler needed).
whisper-cuda = ["whisper-cpp", "whisper-rs/cuda"]

[dependencies]
async-trait.workspace = true
lune-core.workspace = true
tokio.workspace = true
tracing.workspace = true
# `raw-api` re-exports `whisper_rs_sys`, which `gpu_backend.rs` needs for the
# ggml backend-registry calls (`ggml_backend_load_all_from_path` and friends);
# the safe wrapper does not expose them.
whisper-rs = { version = "0.16", optional = true, default-features = false, features = [
    "tracing_backend",
    "raw-api",
] }
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
# Re-verifying the downloaded GPU backend before it is dlopen'd
# (`gpu_backend::installed_plugin_is_intact`).
sha2 = "0.10"
base64 = "0.22"
# Already in the tree via reqwest; declared directly so the retry loop can
# clone the encoded WAV as an Arc bump instead of a multi-MB deep copy.
bytes = "1"
# Streaming the response body so a hostile or broken endpoint can't make us
# buffer an unbounded reply (`read_capped_bytes`).
futures-util.workspace = true
reqwest.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
hound = "3.5"
tempfile = "3.27.0"
lune-llm = { path = "../lune-llm" }
