[package]
name = "lune-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lune-voice"
path = "src/main.rs"

[features]
default = []
cuda = ["lune-llm/cuda", "lune-asr/cuda", "ort/cuda"]
legacy-qwen = ["lune-asr/legacy-qwen"]

[dependencies]
lune-core.workspace = true
lune-audio.workspace = true
lune-asr.workspace = true
lune-llm.workspace = true
lune-output.workspace = true
lune-commands.workspace = true
lune-dict.workspace = true
lune-persist.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde_json.workspace = true
toml.workspace = true
ort.workspace = true
zbus.workspace = true
enigo.workspace = true
arboard.workspace = true
evdev.workspace = true
mimalloc.workspace = true

[dev-dependencies]
hound = "3.5"

[[example]]
name = "pipeline_latency"
path = "../../benchmarks/pipeline_latency.rs"
