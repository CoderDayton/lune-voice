[package]
name = "lune-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["cuda"]
cuda = ["lune-llm/cuda", "lune-asr/cuda", "ort/cuda"]

[dependencies]
lune-core.workspace = true
lune-audio.workspace = true
lune-asr.workspace = true
lune-llm.workspace = true
lune-dict.workspace = true
lune-persist.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde_json.workspace = true
ort.workspace = true
ndarray.workspace = true
arboard.workspace = true
enigo.workspace = true

[target.'cfg(unix)'.dependencies]
evdev = "0.13"
wayland-client = { workspace = true }
wayland-protocols-wlr = { workspace = true }
cosmic-protocols = { workspace = true }

# IBus input-method delivery backend (src/ibus.rs) — Linux only. Windows/macOS
# use the arboard+enigo path and must not pull D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
hound = "3.5"
cpal.workspace = true
tempfile = "3.27.0"

