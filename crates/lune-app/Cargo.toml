[package]
name = "lune-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# Local native backends, compiled into the shipped binary by `cgs build`.
# Off by default so routine checks need no C++ toolchain. The `-cuda` variants
# source-compile CUDA kernels (need nvcc); `gpu` is the umbrella `cgs build`
# enables when the build host has a CUDA toolchain.
whisper-cpp = ["lune-asr/whisper-cpp"]
whisper-cuda = ["whisper-cpp", "lune-asr/whisper-cuda"]
llama-cpp = ["lune-llm/llama-cpp"]
llama-cuda = ["llama-cpp", "lune-llm/llama-cuda"]
gpu = ["whisper-cuda", "llama-cuda"]

[dependencies]
lune-core.workspace = true
lune-audio.workspace = true
lune-asr.workspace = true
lune-llm.workspace = true
lune-dict.workspace = true
lune-persist.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde_json.workspace = true
arboard.workspace = true
enigo.workspace = true
# Output sound cues (src/sound.rs): decode embedded WAVs and play via cpal.
hound = "3.5"
cpal.workspace = true

[target.'cfg(unix)'.dependencies]
evdev = "0.13"
wayland-client = { workspace = true }
wayland-protocols-wlr = { workspace = true }
cosmic-protocols = { workspace = true }

# IBus input-method delivery backend (src/ibus.rs) — Linux only. Windows/macOS
# use the arboard+enigo path and must not pull D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

# ── Benchmarks (benchmarks/*.rs, restored for the whisper.cpp/llama.cpp stack) ──
# Each needs `whisper-cpp` for the real ASR; those that exercise the styling LLM
# also need `llama-cpp`. Build/run with, e.g.:
#   cargo run --release --example asr_probe -p lune-app --features "whisper-cpp llama-cpp" -- <wav>

[[example]]
name = "asr_probe"
path = "../../benchmarks/tools/asr_probe.rs"
required-features = ["whisper-cpp", "llama-cpp"]

[[example]]
name = "live_transcribe"
path = "../../benchmarks/tools/live_transcribe.rs"
required-features = ["whisper-cpp"]

[[example]]
name = "live_bench"
path = "../../benchmarks/tools/live_bench.rs"
required-features = ["whisper-cpp", "llama-cpp"]

[[example]]
name = "noisify_fixtures"
path = "../../benchmarks/tools/noisify_fixtures.rs"

[[example]]
name = "bench_domain"
path = "../../benchmarks/quality/bench_domain.rs"
required-features = ["whisper-cpp", "llama-cpp"]

[[example]]
name = "confusion_mine"
path = "../../benchmarks/quality/confusion_mine.rs"
required-features = ["whisper-cpp"]

[[example]]
name = "pipeline_real"
path = "../../benchmarks/pipeline/pipeline_real.rs"
required-features = ["whisper-cpp", "llama-cpp"]

[[example]]
name = "pipeline_stages"
path = "../../benchmarks/pipeline/pipeline_stages.rs"
required-features = ["whisper-cpp", "llama-cpp"]

[[example]]
name = "session_latency"
path = "../../benchmarks/pipeline/session_latency.rs"
required-features = ["whisper-cpp"]

[[example]]
name = "punctuation_ab"
path = "../../benchmarks/tuning/punctuation_ab.rs"
required-features = ["whisper-cpp", "llama-cpp"]

[[example]]
name = "dict_carrier_ab"
path = "../../benchmarks/tuning/dict_carrier_ab.rs"
required-features = ["llama-cpp"]
