[package]
name = "lune-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lune-voice"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["lune-llm/cuda", "lune-asr/cuda", "ort/cuda"]


[dependencies]
lune-core.workspace = true
lune-audio.workspace = true
lune-asr.workspace = true
lune-llm.workspace = true
lune-output.workspace = true
lune-commands.workspace = true
lune-dict.workspace = true
lune-persist.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
serde_json.workspace = true
toml.workspace = true
ort.workspace = true
mimalloc.workspace = true
arboard.workspace = true
enigo.workspace = true

[target.'cfg(unix)'.dependencies]
evdev.workspace = true
zbus.workspace = true

[dev-dependencies]
hound = "3.5"
cpal.workspace = true
tempfile = "3.27.0"

[[example]]
name = "pipeline_real"
path = "../../benchmarks/pipeline_real.rs"

[[example]]
name = "live_transcribe"
path = "../../benchmarks/live_transcribe.rs"

[[example]]
name = "calibrate_confidence"
path = "../../benchmarks/calibrate_confidence.rs"

[[example]]
name = "noisify_fixtures"
path = "../../benchmarks/noisify_fixtures.rs"
