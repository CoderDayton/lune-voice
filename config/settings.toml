# lune-voice configuration
#
# Location: ~/.config/lune-voice/settings.toml
#
# In TOML, all top-level keys must appear before any [section] headers.


# ── Compute device ────────────────────────────────────────────────────────────
#
# Controls whether the local whisper.cpp ASR backend uses CUDA.
#
#   "auto"  — Try CUDA at startup; fall back to CPU if unavailable. (default)
#   "cuda"  — Prefer CUDA; still falls back gracefully if CUDA init fails.
#   "cpu"   — Force CPU-only, even if a GPU is present.
#
# On machines without NVIDIA drivers, "auto" and "cuda" both behave as "cpu".
device = "auto"

# Built-in style preset applied by default.
# Options: "casual" | "professional" | "formal" | "technical" | "writing"
# Omit (or leave unset) for no styling — the raw transcript is delivered as-is.
# default_style = "casual"

# UI language tag (BCP-47, hint only).
# "auto" lets the app pick from system locale.
language = "auto"

# Dictation language fed to ASR + correction.
# "auto" detects from speech; otherwise a BCP-47 tag like "en-US", "es", "ja".
dictation_language = "auto"

# Privacy policy for backend selection.
# "LocalOnly"       — Reject any remote backend. (default)
# "LocalPreferred"  — Use remote only if explicitly configured and consented.
# "AllowRemote"     — Use whatever backend is configured.
privacy_mode = "LocalOnly"

# How finalized text reaches the focused window.
# "TypeInPlace"  — Type via uinput kernel device; works in any app. (default)
# "Clipboard"    — Copy to clipboard + Ctrl+V paste (compositor-agnostic fallback).
# "Both"         — Type AND copy to clipboard simultaneously.
dictation_mode = "TypeInPlace"

# How the hotkey activates dictation.
# "Toggle"  — Press once to start, press again to stop. (default)
# "Hold"    — Hold key to dictate, release to stop.
activation_mode = "Toggle"

# When to show the floating dictation pill overlay.
# "Always"        — Show whenever the service is ready. (default)
# "WhenDictating" — Show only while a session is active.
# "Never"         — Don't show the pill.
pill_visibility = "Always"

# How delivery picks the paste chord (Ctrl+V vs Ctrl+Shift+V).
# "Auto"     — Probe compositor (Hyprland/Sway/KDE/GNOME). (default)
# "Terminal" — Always Ctrl+Shift+V (use on COSMIC if you dictate into terminals).
# "Normal"   — Always Ctrl+V.
terminal_mode = "Auto"

# Days to retain session history in the database.
# 0 keeps every session forever (no pruning).
# Remove this key (or comment it out) to disable history entirely.
session_history_days = 30

# Free the loaded ASR model after this many minutes without a dictation, and
# reload it on the next hotkey press. Omit (the default) to keep it loaded for
# the life of the process. The model is nearly the whole memory footprint
# (514 MB on the default Medium); a reload costs ~160 ms when the model file is
# still in the OS page cache and ~750 ms when it is not. Microphone audio is
# buffered across the reload, so nothing you say during it is lost.
# model_idle_unload_minutes = 30

# Enable the PCEN-style adaptive AGC frontend before the VAD.
# Improves robustness on quiet mics and noisy environments.
vad_pcen = true

# Launch the app hidden to the system tray instead of showing the main
# window. Click the tray icon (or press the dictation hotkey) to bring it up.
# Useful when Lune is autostarted on login.
start_minimized = false


# ── ASR backend ───────────────────────────────────────────────────────────────
#
# Supported types:
#   "WhisperCpp"        — Local whisper.cpp GGML model. (default, local)
#                         Optional `model = "Small" | "Medium" | "LargeV3Turbo"` (default Medium).
#   "OpenAiCompatible"  — Remote Whisper-compatible HTTP endpoint.
#
[asr_backend]
type = "WhisperCpp"

# Example remote ASR (uncomment + fill to use):
# [asr_backend]
# type = "OpenAiCompatible"
# base_url = "https://api.openai.com/v1"
# api_key  = "sk-..."
# model    = "whisper-1"
# streaming = "Off"   # or "On"


# ── LLM backend ──────────────────────────────────────────────────────────────
#
# Optional style-rewrite pass applied to the transcript when a style preset is
# selected. There is no local styling model; point this at Ollama,
# llama-server, LM Studio, or a hosted API.
#
# Supported types:
#   "OpenAiCompatible"  — Remote OpenAI-compatible endpoint.
#   "Disabled"          — No styling; deliver the raw transcript. (default when omitted)
#
[llm_backend]
type = "Disabled"

# Example remote LLM (uncomment + fill to use):
# [llm_backend]
# type = "OpenAiCompatible"
# base_url   = "https://api.openai.com/v1"
# api_key    = "sk-..."
# model      = "gpt-4o-mini"
# max_tokens = 256


# ── Pipeline overrides (optional) ────────────────────────────────────────────
#
# All fields are optional; omitted fields inherit the active backend's
# recommended default. Uncomment to override.
#
# [pipeline]
# word_confidence_threshold = 0.65   # Below this, words flagged "uncertain" → LLM
# max_speech_secs = 60               # Auto-stop after N seconds of speech
# adaptive_vad = false               # Adapt VAD thresholds to ambient noise
# llm_timeout_secs = 8               # Drop LLM correction if it exceeds this
# speech_threshold = 0.50            # VAD speech-onset probability
# speech_threshold_end = 0.30        # VAD speech-end probability (hysteresis)


# ── Hotkeys ───────────────────────────────────────────────────────────────────
#
# These are NOT registered as system hotkeys by lune-voice itself.
# Register them in your compositor pointing to `lune-voice toggle` / `lune-voice cancel`:
#   COSMIC: Settings → Keyboard → Custom Shortcuts
#   KDE:    System Settings → Shortcuts → Custom Shortcuts
#
# Valid modifiers: "Ctrl", "Shift", "Alt", "Meta"
#
[hotkey.toggle_dictation]
modifiers = ["Ctrl"]
key = "Space"

[hotkey.cancel_dictation]
modifiers = []
key = "Escape"
