version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types:
          - patch
      minor-updates:
        update-types:
          - minor
    ignore:
      # ort-sys links native libs — major bumps need manual validation.
      - dependency-name: ort
        update-types: ["version-update:semver-major"]
      - dependency-name: ort-sys
        update-types: ["version-update:semver-major"]
