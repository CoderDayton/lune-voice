version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types:
          - patch
      minor-updates:
        update-types:
          - minor
    ignore:
      # llama-cpp-2 and ort-sys link native libs — major bumps need manual
      # validation; allow patch/minor only via groups above.
      - dependency-name: llama-cpp-2
        update-types: ["version-update:semver-major"]
      - dependency-name: ort
        update-types: ["version-update:semver-major"]
      - dependency-name: ort-sys
        update-types: ["version-update:semver-major"]
