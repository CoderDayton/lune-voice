name: Linux system deps
description: Install the Tauri, ALSA and D-Bus development packages.
inputs:
  extra:
    description: Additional space-separated apt packages.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      env:
        EXTRA: ${{ inputs.extra }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev \
          libdbus-1-dev \
          libglib2.0-dev \
          libssl-dev \
          libxkbcommon-dev \
          libgtk-3-dev \
          libgtk-layer-shell-dev \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          librsvg2-dev \
          pkg-config \
          $EXTRA
