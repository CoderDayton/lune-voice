name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly advisory scan — every Monday 07:00 UTC.
    - cron: '0 7 * * 1'

# A newer push or PR update cancels the run it supersedes. The event name keeps
# the weekly scheduled scan from being cancelled by a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable incremental compilation — smaller cache, faster cold CI builds.
  CARGO_INCREMENTAL: 0
  # Override .cargo/config.toml target-cpu=native which crashes on CI runners.
  RUSTFLAGS: ""

jobs:
  # ── Format (ubuntu only, fast gate) ───────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: SPDX licence lines
        run: bash scripts/dev/check-spdx.sh

  # ── Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clippy-nocuda-${{ matrix.os }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            pkg-config

      # The whole workspace, including lune-voice (the orchestration core),
      # lune-llm, lune-audio and the Tauri crate. These were previously excluded,
      # which left session.rs and the delivery path with no lint gate on a PR.
      - name: Clippy (all crates)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      # The whole workspace on Windows too. The Linux-only backends are
      # target-gated in Cargo.toml, so what builds here is the Windows half:
      # WASAPI capture, the arboard+enigo delivery driver, and the
      # WH_KEYBOARD_LL hotkey hook. Excluding these crates is what let the
      # Windows build rot unnoticed.
      - name: Clippy (all crates)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test-nocuda-${{ matrix.os }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            pkg-config

      # No `--lib`: that flag was skipping every `tests/` suite in the repo,
      # so the e2e pipeline and whisper-VAD integration tests never ran here.
      - name: Test (all crates, unit + integration)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --no-default-features

      - name: Test (all crates, unit + integration)
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace --no-default-features

  # ── DTO drift guard ───────────────────────────────────────────────────────
  # Ensure ts-rs-generated TypeScript bindings stay in sync with their Rust
  # DTO sources. Running `cargo test -p lune-ui` re-emits files into
  # desktop-ui/src/lib/backend/generated/; if anything differs from the
  # checked-in version, the DTO source was edited without committing the
  # regenerated bindings.
  dto-drift:
    name: DTO Drift
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: dto-drift

      - name: Install Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            pkg-config

      - name: Regenerate DTO bindings
        run: cargo test -p lune-ui --lib

      - name: Verify no drift
        run: |
          if ! git diff --quiet -- desktop-ui/src/lib/backend/generated/; then
            echo "::error::DTO bindings drifted. Run 'cargo test -p lune-ui' locally and commit the regenerated files."
            git --no-pager diff -- desktop-ui/src/lib/backend/generated/
            exit 1
          fi

  # ── whisper.cpp backend (off-by-default real impl) ────────────────────────
  # whisper-cpp is off by default, so the rest of CI compiles only the stub.
  # This job builds the gated real backend so an upstream whisper-rs API change
  # or a regression in the impl fails CI here instead of at the release build.
  whisper-cpp:
    name: whisper.cpp backend
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: whisper-cpp

      - name: Install build deps (cmake + libclang for whisper.cpp/bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev

      - name: Clippy (whisper-cpp real impl)
        run: cargo clippy -p lune-asr --no-default-features --features whisper-cpp --lib -- -D warnings

  # ── Linux bundle (the artifact users actually install) ────────────────────
  # Every other job compiles the whisper stub, and the `whisper-cpp` job above
  # only clippies `lune-asr --lib`. Nothing exercised the real backend linked
  # into `lune-voice` + the Tauri crate, or the bundler itself — so a feature
  # passthrough typo, a bad `resources`/`linux.files` path or a missing icon
  # passed CI green and failed at release time, by hand. This job builds the
  # same PORTABLE CPU artifact `cgs build --env PORTABLE=1 --env BACKEND=cpu`
  # produces (docs/RELEASE.md) and fails the PR instead.
  bundle:
    name: Linux bundle (whisper-cpp)
    # Oldest supported runner: bundles link against the build host's glibc, so
    # building on -latest would silently raise the floor for every user.
    runs-on: ubuntu-22.04
    # Only gate on fmt — a 30+ min compile should not queue behind the full
    # clippy/test matrix, but it should not burn a runner on unformatted code.
    needs: [fmt]
    if: github.event_name != 'schedule'
    env:
      # Portable baseline (AVX2 + FMA + F16C), matching the GGML_* flags below.
      # Overrides the workspace-wide empty RUSTFLAGS at the top of this file.
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bundle-cpu

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install system deps (Tauri + whisper.cpp/bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            pkg-config

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      # Mirrors the PORTABLE branch of `[scripts.build]` in Scripts.toml.
      # GGML_NATIVE=OFF + the explicit ISA flags stop ggml defaulting to
      # `-march=native`, which would SIGILL on any user CPU older than the
      # runner. Bundles come from tauri.conf.json: deb, rpm, appimage.
      - name: Build bundle
        working-directory: desktop-ui
        env:
          GGML_NATIVE: "OFF"
          GGML_AVX2: "ON"
          GGML_FMA: "ON"
          GGML_F16C: "ON"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun tauri build --features whisper-cpp

      # A bundle that built but produced no installable file is still a broken
      # release; assert each configured target actually landed.
      - name: Verify bundle artifacts exist
        run: |
          set -euo pipefail
          fail=0
          for glob in \
            'target/release/bundle/deb/*.deb' \
            'target/release/bundle/rpm/*.rpm' \
            'target/release/bundle/appimage/*.AppImage'; do
            # shellcheck disable=SC2086
            if ! compgen -G "$glob" > /dev/null; then
              echo "::error::no artifact matched $glob"
              fail=1
            else
              echo "ok: $(compgen -G "$glob" | tr '\n' ' ')"
            fi
          done
          exit $fail

      # The udev rule is installed via `bundle.linux.deb.files`; a wrong path
      # there fails silently at bundle time and only shows up as "typing does
      # not work" on a user's machine.
      - name: Verify udev rule is packaged in the .deb
        run: |
          set -euo pipefail
          deb=$(compgen -G 'target/release/bundle/deb/*.deb' | head -1)
          # Capture first, then grep. `dpkg-deb | grep -q` under pipefail is a
          # race: grep exits on the first hit, dpkg-deb dies of SIGPIPE, and the
          # pipeline reports failure for a rule that is present.
          listing=$(dpkg-deb -c "$deb")
          if ! grep -F '99-lune-voice-uinput.rules' <<<"$listing" > /dev/null; then
            echo "::error::udev rule missing from $deb"
            printf '%s\n' "$listing"
            exit 1
          fi
          echo "ok: udev rule present in $deb"

      - uses: actions/upload-artifact@v4
        with:
          name: lune-voice-linux-x86_64-cpu
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

  # ── Security audit (push/PR + weekly schedule) ────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: audit
          # Persist the cargo-audit binary across runs.
          cache-directories: ~/.cargo/bin

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # Advisory ignores and license policy live in deny.toml. `licenses`,
      # `bans` and `sources` were configured there but never actually checked,
      # so a copyleft or unknown-registry dependency could land unnoticed.
      # Next review: 2026-09-01 — check if upstream GTK3/Tauri advisories are resolved.
      - run: cargo deny check advisories licenses bans sources

  # ── Frontend (lint, unit tests, production build) ─────────────────────────
  # The desktop UI is ~117 TypeScript files and had no CI coverage at all;
  # biome and the frontend tests only ran in the local lefthook hook, which a
  # `--no-verify` commit skips entirely.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx @biomejs/biome check src/

      - name: Unit tests
        run: bun test tests/unit src

      - name: Type-check and build
        run: bun run build:ci

  # ── Frontend dependency audit ─────────────────────────────────────────────
  # Mirrors the Rust `audit` job: runs on PRs and on the weekly schedule so a
  # newly-published advisory is caught even without a commit.
  frontend-audit:
    name: Frontend Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun audit --audit-level=high
