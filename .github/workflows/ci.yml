name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly advisory scan — every Monday 07:00 UTC.
    - cron: '0 7 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable incremental compilation — smaller cache, faster cold CI builds.
  CARGO_INCREMENTAL: 0
  # Override .cargo/config.toml target-cpu=native which crashes on CI runners.
  RUSTFLAGS: ""

jobs:
  # ── Format (ubuntu only, fast gate) ───────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clippy-nocuda-${{ matrix.os }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            pkg-config

      # The whole workspace, including lune-voice (the orchestration core),
      # lune-llm, lune-audio and the Tauri crate. These were previously excluded,
      # which left session.rs and the delivery path with no lint gate on a PR.
      - name: Clippy (all crates)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      # Windows has no ALSA/uinput/IBus, so the audio + Linux delivery crates
      # genuinely cannot build there — unlike on Linux, this exclusion is real.
      - name: Clippy (core crates, no desktop UI or audio)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --workspace --exclude lune-ui --exclude lune-audio --exclude lune-voice --lib --tests --no-default-features -- -D warnings

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test-nocuda-${{ matrix.os }}

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            pkg-config

      # No `--lib`: that flag was skipping every `tests/` suite in the repo,
      # so the e2e pipeline and whisper-VAD integration tests never ran here.
      - name: Test (all crates, unit + integration)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --no-default-features

      - name: Test (core crates, no desktop UI or audio)
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace --exclude lune-ui --exclude lune-audio --exclude lune-voice --no-default-features

  # ── DTO drift guard ───────────────────────────────────────────────────────
  # Ensure ts-rs-generated TypeScript bindings stay in sync with their Rust
  # DTO sources. Running `cargo test -p lune-ui` re-emits files into
  # desktop-ui/src/lib/backend/generated/; if anything differs from the
  # checked-in version, the DTO source was edited without committing the
  # regenerated bindings.
  dto-drift:
    name: DTO Drift
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: dto-drift

      - name: Install Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            pkg-config

      - name: Regenerate DTO bindings
        run: cargo test -p lune-ui --lib

      - name: Verify no drift
        run: |
          if ! git diff --quiet -- desktop-ui/src/lib/backend/generated/; then
            echo "::error::DTO bindings drifted. Run 'cargo test -p lune-ui' locally and commit the regenerated files."
            git --no-pager diff -- desktop-ui/src/lib/backend/generated/
            exit 1
          fi

  # ── whisper.cpp backend (off-by-default real impl) ────────────────────────
  # whisper-cpp is off by default, so the rest of CI compiles only the stub.
  # This job builds the gated real backend so an upstream whisper-rs API change
  # or a regression in the impl fails CI here instead of at the release build.
  whisper-cpp:
    name: whisper.cpp backend
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: whisper-cpp

      - name: Install build deps (cmake + libclang for whisper.cpp/bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev

      - name: Clippy (whisper-cpp real impl)
        run: cargo clippy -p lune-asr --no-default-features --features whisper-cpp --lib -- -D warnings

  # ── Security audit (push/PR + weekly schedule) ────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: audit
          # Persist the cargo-audit binary across runs.
          cache-directories: ~/.cargo/bin

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # Advisory ignores and license policy live in deny.toml. `licenses`,
      # `bans` and `sources` were configured there but never actually checked,
      # so a copyleft or unknown-registry dependency could land unnoticed.
      # Next review: 2026-09-01 — check if upstream GTK3/Tauri advisories are resolved.
      - run: cargo deny check advisories licenses bans sources

  # ── Frontend (lint, unit tests, production build) ─────────────────────────
  # The desktop UI is ~117 TypeScript files and had no CI coverage at all;
  # biome and the frontend tests only ran in the local lefthook hook, which a
  # `--no-verify` commit skips entirely.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx @biomejs/biome check src/

      - name: Unit tests
        run: bun test tests/unit src

      - name: Type-check and build
        run: bun run build:ci

  # ── Frontend dependency audit ─────────────────────────────────────────────
  # Mirrors the Rust `audit` job: runs on PRs and on the weekly schedule so a
  # newly-published advisory is caught even without a commit.
  frontend-audit:
    name: Frontend Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun audit --audit-level=high
