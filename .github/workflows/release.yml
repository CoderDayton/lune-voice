name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: ""

jobs:
  build-linux:
    name: Build / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-linux

      - uses: oven-sh/setup-bun@v2

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            pkg-config

      - name: Install frontend deps
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      - name: Test (core crates)
        run: cargo test --workspace --exclude lune-llm --exclude lune-app --exclude lune-ui --exclude lune-audio --no-default-features --lib

      - name: Build Tauri bundles
        working-directory: desktop-ui
        run: bun tauri build

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp desktop-ui/src-tauri/target/release/bundle/deb/*.deb release-artifacts/ 2>/dev/null || true
          cp desktop-ui/src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: release-artifacts/*

  publish:
    name: Create Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
