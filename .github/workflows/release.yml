name: Release

# Cut a release by pushing a version tag:
#
#   # bump `version` in tauri.conf.json, Cargo.toml and desktop-ui/package.json first
#   git tag v0.1.0 && git push origin v0.1.0
#
# This workflow builds the Linux and Windows bundles and opens a DRAFT release
# with them attached. It deliberately does NOT sign anything: the updater's private key
# is the trust root and lives only at ~/.tauri/lune-voice-updater.key, never in
# CI (docs/RELEASE.md, "In-app updater"). Finish the release by hand:
#
#   rm -rf release-artifacts                   # no older release left behind
#   gh release download <tag> -D release-artifacts
#   cgs updater-manifest --env TAG=<tag>       # signs, writes latest.json
#   gh release upload <tag> release-artifacts/latest.json
#   gh release edit <tag> --draft=false
#
# `latest.json` MUST be attached before the release leaves draft, or the
# updater endpoint in tauri.conf.json resolves to a release without a manifest
# and every client's update check fails.

on:
  push:
    tags: ['v*']
  # Allows a dry run against a branch without cutting a tag.
  workflow_dispatch:

# Read-only by default. Only `publish` writes to the release; the build jobs
# run `bun install` and crate build scripts, so they never hold a write token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── Guard: the tag must agree with the version baked into the app ─────────
  # The updater plugin compares the manifest against the RUNNING app's own
  # version, so a release built from a stale tauri.conf.json version is
  # invisible to every client. `cgs updater-manifest` enforces this too, but
  # by then the artifacts are already built — fail in 5 seconds instead.
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Tag matches tauri.conf.json / Cargo.toml / package.json
        run: |
          set -euo pipefail
          conf=$(jq -r .version desktop-ui/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version desktop-ui/package.json)
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)

          echo "tauri.conf.json = $conf"
          echo "package.json    = $pkg"
          echo "Cargo.toml      = $cargo_v"

          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo_v" ]; then
            echo "::error::version drift between tauri.conf.json, package.json and Cargo.toml"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$conf" ]; then
              echo "::error::tag v$tag does not match version $conf — bump the version files or retag"
              exit 1
            fi
            echo "tag $GITHUB_REF_NAME matches version $conf"
          fi

  # ── Linux bundles (CPU; GPU ships separately as the CUDA plugin) ──────────
  build-linux:
    name: Linux bundles
    needs: [verify-version]
    # Bundles link against the build host's glibc — building on -latest would
    # silently raise the minimum glibc for every user.
    runs-on: ubuntu-22.04
    env:
      # PORTABLE baseline (AVX2 + FMA + F16C), matching the GGML_* flags below.
      # Without this the Rust half is built for the runner's CPU and SIGILLs on
      # older user hardware.
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    # No build cache: a release compiles from scratch, so nothing another ref
    # wrote into a shared cache can end up in the shipped binary.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install system deps (Tauri + whisper.cpp/bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libssl-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            pkg-config

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      # The bundle ships THIRD_PARTY_LICENSES.md; it must list what this build
      # compiles in. Pinned so the check cannot drift with a cargo-about release.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.2

      - name: Third-party licences are current
        run: bash scripts/release/third-party-licenses.sh --check

      # Mirrors the PORTABLE branch of `[scripts.build]` in Scripts.toml.
      # GGML_NATIVE=OFF plus the explicit ISA flags stop ggml defaulting to
      # `-march=native`. Targets come from tauri.conf.json: deb, rpm, appimage.
      - name: Build bundles
        working-directory: desktop-ui
        env:
          GGML_NATIVE: "OFF"
          GGML_AVX2: "ON"
          GGML_FMA: "ON"
          GGML_F16C: "ON"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun tauri build --features whisper-cpp

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          # Same names as `cgs package`: tauri names bundles after
          # `productName` ("Lune Voice"), and the space breaks download URLs.
          for f in target/release/bundle/deb/*.deb \
                   target/release/bundle/rpm/*.rpm \
                   target/release/bundle/appimage/*.AppImage; do
            dest="$(basename "$f")"
            cp "$f" "release-artifacts/${dest//Lune Voice/lune-voice}"
          done
          (cd release-artifacts && sha256sum ./* > SHA256SUMS)
          ls -la release-artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lune-voice-linux-x86_64
          path: release-artifacts/*
          if-no-files-found: error

  # ── Windows bundle (CPU; the CUDA plugin is Linux-only for now) ───────────
  build-windows:
    name: Windows bundle
    needs: [verify-version]
    runs-on: windows-latest
    env:
      # Same portability floor as the Linux bundle: without it the Rust half is
      # built for the runner's CPU and faults on older user hardware.
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    # No build cache, for the same reason as the Linux job.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: bun install --frozen-lockfile

      # whisper.cpp needs cmake plus libclang for bindgen. Both ship on the
      # runner image; bindgen only needs to be told where clang lives.
      - name: Build bundle
        working-directory: desktop-ui
        shell: bash
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
          GGML_NATIVE: "OFF"
          GGML_AVX2: "ON"
          GGML_FMA: "ON"
          GGML_F16C: "ON"
        run: bun tauri build --features whisper-cpp

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for f in target/release/bundle/nsis/*-setup.exe; do
            dest="$(basename "$f")"
            cp "$f" "release-artifacts/${dest//Lune Voice/lune-voice}"
          done
          (cd release-artifacts && sha256sum ./* > SHA256SUMS-windows)
          ls -la release-artifacts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lune-voice-windows-x86_64
          path: release-artifacts/*
          if-no-files-found: error

  # ── Draft release ─────────────────────────────────────────────────────────
  # The one job with a write token. It runs no project code: it collects what
  # the build jobs uploaded and attaches it to the draft.
  publish:
    name: Draft release
    needs: [build-linux, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          merge-multiple: true

      # Draft, not published: `latest.json` still has to be signed locally and
      # uploaded before this is visible to the updater. See the header comment.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so `gh` cannot read the repo from a git remote.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<'EOF'
          > **Draft — not ready to publish.**
          > `latest.json` is not attached yet, so the in-app updater cannot see
          > this release. Sign and attach it before undrafting:
          >
          > ```
          > gh release download TAG -D release-artifacts
          > cgs updater-manifest --env TAG=TAG
          > gh release upload TAG release-artifacts/latest.json
          > gh release edit TAG --draft=false
          > ```
          EOF
          # Re-running the workflow on an existing tag re-uploads rather than
          # failing on a duplicate release.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
