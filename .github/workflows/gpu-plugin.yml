name: GPU plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the archives attach to (the `url` in crates/lune-persist/src/gpu_plugin.rs)
        default: gpu-v2
        required: true

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: '1.4.363.0'
  VULKAN_SDK_LINUX_SHA256: 197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43
  VULKAN_SDK_WINDOWS_SHA256: 94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141

jobs:
  check-tag:
    name: Tag is unpublished
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null) && [ "$is_draft" != "true" ]; then
            echo "::error::release $TAG is already published; its assets are pinned by digest in gpu_plugin.rs. Use a new tag."
            exit 1
          fi

  build-linux:
    name: Linux plugin
    needs: [check-tag]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Vulkan SDK
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/vulkansdk.tar.xz" \
            "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          echo "$VULKAN_SDK_LINUX_SHA256  $RUNNER_TEMP/vulkansdk.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vulkansdk"
          tar -xJf "$RUNNER_TEMP/vulkansdk.tar.xz" -C "$RUNNER_TEMP/vulkansdk"
          sdk="$RUNNER_TEMP/vulkansdk/$VULKAN_SDK_VERSION/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Build plugin
        run: bash scripts/release/gpu-plugin-vulkan.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-plugin-linux
          path: release-artifacts/lune-voice-gpu-*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-windows:
    name: Windows plugin
    needs: [check-tag]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $env:VULKAN_SDK_WINDOWS_SHA256) { throw 'Vulkan SDK digest mismatch' }
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          & $exe --root $root --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed ($LASTEXITCODE)" }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Install Ninja
        run: pip install ninja==1.13.0

      - name: Build plugin
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
        run: bash scripts/release/gpu-plugin-vulkan.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-plugin-windows
          path: release-artifacts/lune-voice-gpu-*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Draft release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $TAG is already published; its assets are pinned by digest in gpu_plugin.rs. Use a new tag."
              exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "GPU plugin ($TAG)" \
              --notes "Vulkan backend plugins. Pin each digest and byte size in crates/lune-persist/src/gpu_plugin.rs before publishing."
          fi
          gh release upload "$TAG" release-artifacts/* --clobber
          for f in release-artifacts/*.tar.gz; do
            echo "$(basename "$f"): $(stat -c %s "$f") bytes, sha256 $(cut -d' ' -f1 "$f.sha256")" >> "$GITHUB_STEP_SUMMARY"
          done
