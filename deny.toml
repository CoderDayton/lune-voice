[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Upstream GTK3/Tauri transitive deps — no fix available until Tauri migrates
# to GTK4. Review quarterly; next review: 2026-09-01.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "GTK3 upstream — no Tauri 2.x fix" },
    { id = "RUSTSEC-2024-0384", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0411", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0412", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0413", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0414", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0415", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0416", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0417", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0418", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0419", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0420", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0429", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2024-0436", reason = "GTK3 upstream" },
    { id = "RUSTSEC-2025-0012", reason = "Tauri transitive dep" },
    { id = "RUSTSEC-2025-0057", reason = "Tauri transitive dep" },
    { id = "RUSTSEC-2025-0075", reason = "Tauri transitive dep" },
    { id = "RUSTSEC-2025-0080", reason = "Tauri transitive dep" },
    { id = "RUSTSEC-2025-0081", reason = "Tauri transitive dep" },
    { id = "RUSTSEC-2025-0098", reason = "Tauri transitive dep" },
    { id = "RUSTSEC-2025-0100", reason = "Tauri transitive dep" },
    { id = "RUSTSEC-2025-0119", reason = "Tauri transitive dep" },
    { id = "RUSTSEC-2024-0422", reason = "GTK3 upstream — gtk-layer-shell, needed for the native pill" },
    { id = "RUSTSEC-2024-0423", reason = "GTK3 upstream — gtk-layer-shell-sys" },
    # Unmaintained, not vulnerable. bincode 2 is a direct dep of lune-dict's
    # build script (the compiled vocab tables); the advisory offers no successor.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained — no safe upgrade exists" },
    # zip 4 via tauri-plugin-updater: every 2.x release (2.14.0 included) pins
    # zip ^4, and the fixed zip 9 only lands in the 3.0 alphas. Not reachable
    # in practice: zip is a Windows-only dependency, the updater extracts only
    # after the archive passes our minisign key check, and the SUID/symlink
    # issues are Unix permission handling. Drop these on the updater 3.0 move.
    { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater — signed archives only, no 2.x fix" },
    { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater — signed archives only, no 2.x fix" },
    { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater — signed archives only, no 2.x fix" },
    # Unmaintained, not vulnerable: zbus 5's helper crates, used by lune-voice
    # and notify-rust. Their successor is zbus 6, which notify-rust has not
    # adopted yet.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained — zbus 5, successor is zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained — zbus 5, successor is zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained — zbus 5, successor is zbus 6" },
]

[licenses]
# The allow-list is exhaustive: any license not named here is denied, which
# covers copyleft without a separate key. `unlicensed`/`copyleft` were removed
# in cargo-deny 0.18; keeping them made this config fail to parse at all.
allow = [
    # Lune Voice's own crates.
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
name = "wordnik_list"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
