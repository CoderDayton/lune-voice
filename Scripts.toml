[global_env]
RUST_BACKTRACE = "1"

[scripts]

[scripts.list]
interpreter = "bash"
command = '''
cgs show
'''
info = "List all available scripts"

# ── Desktop UI ──────────────────────────────────────────────────────────────

[scripts.dev]
interpreter = "bash"
command = '''
cd desktop-ui && bun tauri dev
'''
info = "Launch Tauri app in dev mode (hot-reload)"
requires = ["bun"]

[scripts.ui-build]
interpreter = "bash"
command = '''
cd desktop-ui && bun tauri build
'''
info = "Production build of desktop app"
requires = ["bun"]

# ── Quick iteration ──────────────────────────────────────────────────────────

check = { command = "cargo check --workspace", info = "Type-check all crates" }
clippy = { command = "cargo clippy --workspace -- -D warnings", info = "Lint with clippy (deny warnings)" }

[scripts.fmt]
interpreter = "bash"
command = '''
if [ "$FIX" = "1" ]; then cargo fmt --all; else cargo fmt --all --check; fi
'''
info = "Check formatting (--env FIX=1 to apply)"

# ── Testing ──────────────────────────────────────────────────────────────────

test = { command = "cargo test --workspace", info = "Run unit tests (no real models)" }

[scripts.test-e2e]
interpreter = "bash"
command = '''
cargo test -p lune-app --test e2e_pipeline -- --ignored --nocapture
'''
info = "Real-model integration tests (requires models on disk)"

# ── Benchmarks ───────────────────────────────────────────────────────────────

[scripts.bench]
interpreter = "bash"
command = '''
case "${TYPE:-real}" in
  stages)    cargo run --release --example pipeline_stages -p lune-app ;;
  real)      cargo run --release --example pipeline_real -p lune-app ;;
  latency)   cargo run --release --example session_latency -p lune-app ;;
  confusion) cargo run --release --example confusion_mine -p lune-app ;;
  *)         echo "TYPE must be stages|real|latency|confusion"; exit 1 ;;
esac
'''
info = "Benchmark (--env TYPE=stages|real|latency|confusion)"

# ── Build ────────────────────────────────────────────────────────────────────

build = { command = "cargo build --release", info = "Release build (CUDA default)" }

# ── Tools ────────────────────────────────────────────────────────────────────

[scripts.vad-inspect]
interpreter = "bash"
command = '''
if [ -z "$WAV" ]; then echo "Usage: cgs run vad-inspect --env WAV=path/to/file.wav"; exit 1; fi
cargo run --release -p lune-audio --example vad_inspect -- "$WAV"
'''
info = "VAD timeline analysis on a WAV file (--env WAV=path)"

[scripts.record]
command = "uv run scripts/record_mic.py"
info = "Record mic to float32 WAV (16kHz mono)"
requires = ["uv"]

[scripts.install]
command = "bash scripts/install.sh"
info = "Install systemd unit + binary"

[scripts.uninstall]
command = "bash scripts/uninstall.sh"
info = "Remove systemd service + binary"

# ── CI / composite ──────────────────────────────────────────────────────────

ci = { include = ["fmt", "clippy", "check", "test"], info = "Full CI: fmt + clippy + check + test" }

# ── Cleanup ──────────────────────────────────────────────────────────────────

[scripts.clean]
interpreter = "bash"
command = '''
cargo clean
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
if [ "$ALL" = "1" ]; then
  rm -rf .venv
  echo "cleaned target/ + __pycache__ + .venv"
else
  echo "cleaned target/ + __pycache__"
fi
'''
info = "Clean build artifacts (--env ALL=1 includes .venv)"

# ── ONNX model export ───────────────────────────────────────────────────────

[scripts.export]
command = "uv run python scripts/export_onnx.py --asr"
info = "Export Qwen3-ASR ONNX model"
requires = ["uv"]
