[global_env]
RUST_BACKTRACE = "1"

[scripts]

[scripts.list]
interpreter = "bash"
command = '''
cgs show
'''
info = "List all available scripts"

# ── Desktop UI ──────────────────────────────────────────────────────────────

[scripts.dev]
interpreter = "bash"
command = '''
cd desktop-ui && bun tauri dev
'''
info = "Launch Tauri app in dev mode (hot-reload)"
requires = ["bun"]

# ── Quick iteration ──────────────────────────────────────────────────────────

[scripts.check]
command = "cargo check --workspace"
info = "Type-check all crates"

[scripts.clippy]
command = "cargo clippy --workspace -- -D warnings"
info = "Lint with clippy (deny warnings)"

[scripts.fmt]
interpreter = "bash"
command = '''
if [ "$FIX" = "1" ]; then cargo fmt --all; else cargo fmt --all --check; fi
'''
info = "Check formatting (--env FIX=1 to apply)"

# ── Testing ──────────────────────────────────────────────────────────────────

[scripts.test]
command = "cargo test --workspace"
info = "Run unit tests (no real models)"

[scripts.test-e2e]
interpreter = "bash"
command = '''
cargo test -p lune-app --test e2e_pipeline -- --nocapture
'''
info = "Run lightweight app pipeline integration tests"

# ── Benchmarks ───────────────────────────────────────────────────────────────

[scripts.bench]
interpreter = "bash"
command = '''
case "${TYPE:-agc}" in
  agc)       cargo run --release --example agc_bench -p lune-audio ;;
  *)         echo "TYPE must be agc"; exit 1 ;;
esac
'''
info = "Benchmark (--env TYPE=agc)"

# ── Build ────────────────────────────────────────────────────────────────────

[scripts.build]
interpreter = "bash"
# Production desktop app. `tauri build` does the release Rust compile + UI build
# + bundle in one step. `--features whisper-cpp llama-cpp` compiles the local
# whisper.cpp + llama.cpp backends into the shipped binary (users never compile
# them themselves). CUDA is auto-enabled when the build host has the toolchain
# (nvcc + an NVIDIA GPU): since these backends compile from source here, GPU
# support is a build-host decision — a CPU-only host produces a portable
# CPU-only app, a CUDA host produces a GPU-accelerated one. The GGML_* flags
# force a portable AVX2 CPU baseline instead of ggml's default `-march=native`,
# which would SIGILL on any user CPU older than the build host.
# Build host needs: cmake, a C++ toolchain, and libclang (for bindgen); plus the
# CUDA toolkit for a GPU build.
command = '''
cd desktop-ui
FEATURES="whisper-cpp llama-cpp"
if command -v nvcc >/dev/null 2>&1 && command -v nvidia-smi >/dev/null 2>&1; then
  FEATURES="whisper-cuda llama-cuda"
  echo "CUDA toolchain detected — building with GPU acceleration ($FEATURES)"
else
  echo "No CUDA toolchain — building CPU-only ($FEATURES)"
fi
GGML_NATIVE=OFF GGML_AVX2=ON GGML_FMA=ON GGML_F16C=ON APPIMAGE_EXTRACT_AND_RUN=1 bun tauri build --features "$FEATURES"
'''
info = "Production desktop app (ships whisper.cpp + llama.cpp; auto-detects CUDA)"
requires = ["bun"]

# ── Tools ────────────────────────────────────────────────────────────────────

[scripts.vad-inspect]
interpreter = "bash"
command = '''
if [ -z "$WAV" ]; then echo "Usage: cgs run vad-inspect --env WAV=path/to/file.wav"; exit 1; fi
cargo run --release -p lune-audio --example vad_inspect -- "$WAV"
'''
info = "VAD timeline analysis on a WAV file (--env WAV=path)"

[scripts.record]
command = "uv run scripts/dev/record_mic.py"
info = "Record mic to float32 WAV (16kHz mono)"
requires = ["uv"]

[scripts.package]
interpreter = "bash"
command = '''
bash scripts/release/package-all.sh "${TYPE:-all}"
'''
info = "Build .deb/.AppImage/.rpm via Docker (--env TYPE=all|deb-appimage|rpm)"

# ── CI / composite ──────────────────────────────────────────────────────────

[scripts.ci]
include = ["fmt", "clippy", "check", "test"]
info = "Full CI: fmt + clippy + check + test"

# ── Cleanup ──────────────────────────────────────────────────────────────────

[scripts.clean]
interpreter = "bash"
command = '''
cargo clean
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
if [ "$ALL" = "1" ]; then
  rm -rf .venv
  echo "cleaned target/ + __pycache__ + .venv"
else
  echo "cleaned target/ + __pycache__"
fi
'''
info = "Clean build artifacts (--env ALL=1 includes .venv)"

