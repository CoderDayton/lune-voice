[global_env]
RUST_BACKTRACE = "1"

[scripts]

[scripts.list]
interpreter = "bash"
command = '''
cgs show
'''
info = "List all available scripts"

# ── Desktop UI ──────────────────────────────────────────────────────────────

[scripts.dev]
interpreter = "bash"
# Dev app needs the native whisper.cpp backend compiled in, otherwise the ASR
# stub returns "backend not compiled in" and dictation fails. `default = []`
# keeps routine `cargo check` toolchain-light, so the features are passed here
# explicitly (mirroring `cgs build`). BACKEND auto-detects: if unset, a CUDA
# build is used when both nvcc and nvidia-smi are present, else CPU. Force
# either with `--env BACKEND=cpu|cuda`. Unlike release builds GGML_NATIVE is
# left on so the dev build tunes for THIS machine's CPU.
command = '''
cd desktop-ui
BACKEND="${BACKEND:-}"
if [ -z "$BACKEND" ]; then
  if command -v nvcc >/dev/null 2>&1 && command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
    BACKEND=cuda
  else
    BACKEND=cpu
  fi
fi
case "$BACKEND" in
  cpu)  FEATURES="whisper-cpp" ;;
  cuda) FEATURES="whisper-cuda" ;;
  *)    echo "BACKEND must be cpu|cuda"; exit 1 ;;
esac
# ggml compute backends are dlopen-ed plugins, so the CUDA backend can ship as
# an optional download instead of a load-time dependency. GGML_NATIVE is
# incompatible with it (ggml needs ARCH_DEFINITIONS for the feature check), so
# CPU dispatch comes from the per-microarchitecture variants instead.
GGML_FLAGS="GGML_BACKEND_DL=ON GGML_NATIVE=OFF GGML_CPU_ALL_VARIANTS=ON"
# Host-tuned Rust codegen for the dev build. Opt-in here rather than pinned in
# `.cargo/config.toml`, so a plain `cargo build` stays portable.
export RUSTFLAGS="${RUSTFLAGS:--C target-cpu=native}"
echo "Dev ($BACKEND): --features \"$FEATURES\" ($GGML_FLAGS)"
env $GGML_FLAGS bun tauri dev --features "$FEATURES"
'''
info = "Launch Tauri app in dev mode (hot-reload; CUDA auto-detected, --env BACKEND=cpu|cuda to force)"
requires = ["bun"]

# ── Quick iteration ──────────────────────────────────────────────────────────

[scripts.check]
command = "cargo check --workspace"
info = "Type-check all crates"

[scripts.clippy]
command = "cargo clippy --workspace -- -D warnings"
info = "Lint with clippy (deny warnings)"

# The whole workspace type-checked for Windows from this Linux box, so the
# `cfg(target_os = "windows")` halves of the platform split cannot rot between
# pushes. `lune-ui` is included: `tauri_build` compiles the icon/manifest
# resource with binutils' `x86_64-w64-mingw32-windres`, wired to a `zig cc`
# preprocessor by `.cargo/config.toml`. It reads `desktop-ui/dist`, so run
# `bun run build` in `desktop-ui/` first on a fresh clone.
#
# Check only, never build: the C toolchain comes from `zig cc` via
# `.cargo/config.toml`, and linking would additionally need a MinGW `gcc` as the
# linker driver.
[scripts.check-windows]
interpreter = "bash"
command = '''
if ! command -v zig >/dev/null 2>&1; then
  echo "zig not found — install it (the C cross-compiler for this check)"; exit 1
fi
if ! command -v x86_64-w64-mingw32-windres >/dev/null 2>&1; then
  echo "x86_64-w64-mingw32-windres not found — install binutils-mingw-w64-x86-64 (lune-ui's resource compiler)"; exit 1
fi
if ! rustup target list --installed | grep -qx x86_64-pc-windows-gnu; then
  echo "adding the x86_64-pc-windows-gnu rust target"
  rustup target add x86_64-pc-windows-gnu
fi
cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
'''
info = "Cross-check the whole workspace for Windows (needs zig + mingw binutils)"
requires = ["zig", "rustup"]

[scripts.fmt]
interpreter = "bash"
command = '''
if [ "$FIX" = "1" ]; then cargo fmt --all; else cargo fmt --all --check; fi
'''
info = "Check formatting (--env FIX=1 to apply)"

# ── Testing ──────────────────────────────────────────────────────────────────

[scripts.test]
interpreter = "bash"
# `cargo test --workspace` builds example targets but does NOT run the tests
# inside them, so the benchmark metric and baseline-gate tests in
# benchmarks/bench_utils.rs need the explicit `--examples` pass. Examples with
# `required-features` are skipped there, so this stays toolchain-light.
command = '''
set -e
cargo test --workspace
cargo test -p lune-voice --examples
'''
info = "Run unit tests, including the benchmark helpers (no real models)"

[scripts.test-e2e]
interpreter = "bash"
command = '''
cargo test -p lune-voice --test e2e_pipeline -- --nocapture
'''
info = "Run lightweight app pipeline integration tests"

# ── Benchmarks ───────────────────────────────────────────────────────────────

[scripts.bench]
interpreter = "bash"
# Real-pipeline benchmarks. Model-backed ones build whisper.cpp and need a
# model on disk; the styling pass talks to a remote OpenAI-compatible endpoint
# (LUNE_BENCH_LLM_* env vars). CUDA features auto-detect (mirrors cgs build/dev).
# `transcribe` runs the whole capture→AGC→VAD→whisper(+styling) pipeline on a
# WAV/f32/dir and prints the hypothesis — the GUI-free way to test ASR quality.
command = '''
TYPE="${TYPE:-agc}"
if command -v nvcc >/dev/null 2>&1 && command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
  FEATURES="whisper-cuda"
else
  FEATURES="whisper-cpp"
fi
[ -d /lib/x86_64-linux-gnu ] && export LIBCLANG_PATH="${LIBCLANG_PATH:-/lib/x86_64-linux-gnu}"
run() { cargo run --release --example "$1" -p lune-voice --features "$FEATURES" "${@:2}"; }
case "$TYPE" in
  agc)         cargo run --release --example agc_bench -p lune-audio ;;
  transcribe)  [ -z "$WAV" ] && { echo "set --env WAV=path (.wav/.f32/dir)"; exit 1; }; run asr_probe -- "$WAV" ;;
  domain)      run bench_domain ;;
  pipeline)    run pipeline_real ;;
  stages)      run pipeline_stages ;;
  latency)     run session_latency ;;
  vram)        run vram_probe ;;
  modelload)   run model_load ;;
  punctuation) run punctuation_ab ;;
  dict)        run dict_carrier_ab ;;
  snippets)    cargo run --release --example snippet_bench -p lune-voice ;;
  styling)     run styling_capability ;;
  rulecmp)     run styling_rulecmp ;;
  live)        run live_transcribe ;;
  confusion)   run confusion_mine ;;
  noisify)     run noisify_fixtures ;;
  livewer)     run live_bench ;;
  *) echo "TYPE must be: agc | transcribe(WAV=) | domain | pipeline | stages | latency | vram | modelload | punctuation | dict | snippets | styling | rulecmp | live | livewer | confusion | noisify"; exit 1 ;;
esac
'''
info = "Benchmarks (--env TYPE=agc|transcribe|domain|pipeline|stages|latency|vram|modelload|punctuation|dict|snippets|styling|rulecmp|live|livewer|confusion|noisify; transcribe needs WAV=). TYPE=modelload times cold/warm model load and unload per whisper model (--env REPEATS=n, DEVICE=cpu|cuda). TYPE=vram measures device memory across dictation toggles and a model swap (NVIDIA only; --env CYCLES=n). Pin the model with --env WHISPER_MODEL=small|medium|large. TYPE=domain gates on a baseline: --env LUNE_BENCH_JSON=out.json to record, --env LUNE_BENCH_BASELINE=base.json to fail on regression (--env LUNE_BENCH_TOLERANCE=pts, default 1.0)"

# ── Build ────────────────────────────────────────────────────────────────────

[scripts.build]
interpreter = "bash"
# Desktop app: `tauri build` does the release Rust compile + UI build + bundle
# in one step, compiling whisper.cpp into the binary (users never compile
# anything — this produces the artifact they'd run).
#
# TWO build profiles:
#   • Default (NATIVE): a static build with `GGML_NATIVE=ON`, tuned to THIS
#     machine's CPU and, for CUDA, only the build host's GPU arch (e.g. sm_89).
#     The CUDA compile is ~8x smaller and won't exhaust RAM. The binary runs
#     great here but is NOT portable to other CPUs/GPUs. The right local build.
#   • PORTABLE (`--env PORTABLE=1`): the distributable build release and CI use,
#     via scripts/release/build-bundles.sh. CPU only: ggml as shared libraries
#     with two CPU backend plugins, AVX2 and SSE4.2, picked at runtime, so it
#     runs on any x86-64-v2 CPU; GPU arrives as the downloadable CUDA plugin
#     (docs/GPU_PLUGIN.md). Run it from the build tree with
#     `cgs stage-runtime --env PROFILE=release`.
#
# Backend AUTO-DETECTS for NATIVE: if `BACKEND` is unset and both nvcc and a
# working nvidia-smi are present, CUDA is built; otherwise CPU. Force with
# `--env BACKEND=cpu|cuda`. macOS Metal and the full release matrix: docs/RELEASE.md.
# Build host needs: cmake, a C++ toolchain, and libclang (for bindgen); plus the
# CUDA toolkit for a `cuda` build.
command = '''
# Compile only. The shippable installers are `cgs package`, which builds them in
# containers against an old glibc so they install on other distros — a bundle
# made here links this machine's libraries and is not distributable. Pass
# --env BUNDLE=1 to bundle locally anyway, for testing the .deb layout itself.
if [ -n "${BUNDLE:-}" ]; then
  BUNDLE_ARGS="--bundles ${BUNDLES:-deb appimage}"
else
  BUNDLE_ARGS="--no-bundle"
fi
if [ -n "${PORTABLE:-}" ]; then
  if [ "${BACKEND:-cpu}" != "cpu" ]; then
    echo "PORTABLE builds are CPU only; GPU ships as the CUDA plugin (cgs gpu-plugin)"; exit 1
  fi
  APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/release/build-bundles.sh $BUNDLE_ARGS
  exit $?
fi
cd desktop-ui
BACKEND="${BACKEND:-}"
if [ -z "$BACKEND" ]; then
  if command -v nvcc >/dev/null 2>&1 && command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
    BACKEND=cuda
  else
    BACKEND=cpu
  fi
fi
case "$BACKEND" in
  cpu)  FEATURES="whisper-cpp" ;;
  cuda) FEATURES="whisper-cuda" ;;
  *)    echo "BACKEND must be cpu|cuda (macOS Metal: see docs/RELEASE.md)"; exit 1 ;;
esac
GGML_FLAGS="GGML_NATIVE=ON"
# Host-tuned Rust codegen to match GGML_NATIVE. This is opt-in per build
# rather than pinned in `.cargo/config.toml`, so a plain `cargo build
# --release` stays portable.
export RUSTFLAGS="${RUSTFLAGS:--C target-cpu=native}"
echo "Building NATIVE $BACKEND build (this machine only): --features \"$FEATURES\" RUSTFLAGS=\"$RUSTFLAGS\""
env $GGML_FLAGS APPIMAGE_EXTRACT_AND_RUN=1 bun tauri build --features "$FEATURES" $BUNDLE_ARGS
'''
info = "Compile the desktop app, no installers — native to this machine (CUDA auto-detected). --env PORTABLE=1 for the distributable CPU build; --env BACKEND=cpu|cuda to force; --env BUNDLE=1 to also bundle locally. Installers: cgs package. See docs/RELEASE.md"
requires = ["bun"]

[scripts.stage-runtime]
interpreter = "bash"
command = '''
set -euo pipefail
# Assemble the runtime layout a GGML_BACKEND_DL build needs beside the binary:
#
#   <bin dir>/libwhisper.so.1, libggml.so.0, libggml-base.so.0   (DT_NEEDED)
#   <bin dir>/backends/libggml-cpu-*.so, libggml-cuda.so         (dlopen-ed)
#
# The executable carries RUNPATH=$ORIGIN (desktop-ui/src-tauri/build.rs), so the
# core libraries resolve from its own directory with no LD_LIBRARY_PATH.
PROFILE="${PROFILE:-debug}"
BIN_DIR="target/$PROFILE"
# Cargo keeps two `whisper-rs-sys-*` directories — the compiled build script and
# the directory its run produced — and only the latter has `out/lib`. Newest
# first, but filtered, so a freshly recompiled build script cannot shadow the
# real output and make this look like an unbuilt tree.
SRC_DIR=""
for d in $(ls -dt target/$PROFILE/build/whisper-rs-sys-*/ 2>/dev/null || true); do
  if [ -d "$d/out/lib" ]; then SRC_DIR="$d"; break; fi
done

if [ -z "$SRC_DIR" ] || [ ! -d "$SRC_DIR/out/lib" ]; then
  echo "no whisper-rs-sys build output under target/$PROFILE — build with the whisper-cpp feature first" >&2
  exit 1
fi
if ! ls "$SRC_DIR"/out/lib/libggml-base.so* >/dev/null 2>&1; then
  echo "whisper-rs-sys built static libraries — rebuild with GGML_BACKEND_DL=ON" >&2
  exit 1
fi

# The test harness runs binaries from target/<profile>/deps, so stage there too.
mkdir -p "$BIN_DIR/backends" "$BIN_DIR/deps/backends"
for dest in "$BIN_DIR" "$BIN_DIR/deps"; do
  cp -a "$SRC_DIR"/out/lib/libwhisper.so* "$SRC_DIR"/out/lib/libggml*.so* "$dest/"
  cp -a "$SRC_DIR"/out/bin/libggml-cpu-*.so "$dest/backends/"
  # A `whisper-cuda` build emits the CUDA backend as a plugin as well, and ggml
  # only ever dlopen-s it from a backends dir — without this, `cgs dev --env
  # BACKEND=cuda` compiles CUDA and then silently runs on the CPU. A CPU build
  # has no such file, so this stays optional.
  if [ -e "$SRC_DIR/out/bin/libggml-cuda.so" ]; then
    cp -a "$SRC_DIR"/out/bin/libggml-cuda.so "$dest/backends/"
  fi
done

COUNT=$(ls "$BIN_DIR"/backends | wc -l)
if [ -e "$BIN_DIR/backends/libggml-cuda.so" ]; then
  echo "staged $COUNT backend plugins into $BIN_DIR/backends (CPU + CUDA)"
else
  echo "staged $COUNT backend plugins into $BIN_DIR/backends (CPU only — build with the whisper-cuda feature for GPU)"
fi
'''
info = "Copy the ggml shared libraries and backend plugins (CPU, plus CUDA when built) next to the built binary (--env PROFILE=release)"

[scripts.gpu-plugin]
interpreter = "bash"
command = '''
set -euo pipefail
# Build the downloadable CUDA backend plugin and package it for GitHub Releases.
#
# The archive is deliberately self-contained apart from the NVIDIA *driver*:
# libcudart/libcublas/libcublasLt are redistributable under the CUDA EULA,
# libcuda.so.1 ships with the driver and is not ours to distribute. The plugin
# is linked with RUNPATH=$ORIGIN so it resolves those runtime libraries from its
# own directory — LD_LIBRARY_PATH cannot be used here, because glibc caches the
# search path at process start and the app sets nothing before dlopen.
OUT="${OUT:-release-artifacts}"
BUILD_DIR="${BUILD_DIR:-target/gpu-plugin}"
SRC="vendor/whisper-rs-sys/whisper.cpp"
CUDA_LIB="${CUDA_LIB:-/usr/local/cuda/targets/x86_64-linux/lib}"
# Native SASS for the four consumer generations CUDA 13 supports (Turing,
# Ampere, Ada, Blackwell), plus compute_75 PTX as a floor. PTX JITs *forward*
# only, so the oldest virtual arch covers every other supported GPU — A100,
# H100, datacentre Blackwell — at the cost of a one-off JIT on first run.
# Each extra -real arch adds its own SASS to the download; override to trade
# coverage for size.
CUDA_ARCHS="${CUDA_ARCHS:-75-real;86-real;89-real;120-real;75-virtual}"

command -v cmake    >/dev/null || { echo "cmake is required" >&2; exit 1; }
command -v nvcc     >/dev/null || { echo "the CUDA toolkit (nvcc) is required" >&2; exit 1; }
command -v cuobjdump >/dev/null || { echo "cuobjdump (CUDA toolkit) is required" >&2; exit 1; }
[ -d "$SRC" ] || { echo "missing $SRC" >&2; exit 1; }

# CMake caches CMAKE_CUDA_ARCHITECTURES, so reusing a build dir configured for a
# narrower list silently keeps producing that narrower plugin. This shipped an
# sm_89-only archive once; reconfigure from scratch whenever the list changes.
CACHED_ARCHS=$(grep -oP '^CMAKE_CUDA_ARCHITECTURES:[^=]*=\K.*' "$BUILD_DIR/CMakeCache.txt" 2>/dev/null || true)
if [ -n "$CACHED_ARCHS" ] && [ "$CACHED_ARCHS" != "$CUDA_ARCHS" ]; then
  echo "CUDA architectures changed ($CACHED_ARCHS -> $CUDA_ARCHS); reconfiguring"
  rm -rf "$BUILD_DIR"
fi

CUDA_VER=$(basename "$(readlink -f "$CUDA_LIB"/libcudart.so.* | head -1)" | sed 's/libcudart\.so\.//' | cut -d. -f1)
[ -n "$CUDA_VER" ] || { echo "could not determine the CUDA runtime soname version" >&2; exit 1; }
echo "Building CUDA $CUDA_VER backend plugin for archs $CUDA_ARCHS"

cmake -S "$SRC" -B "$BUILD_DIR" \
  -DCMAKE_BUILD_TYPE=Release \
  -DBUILD_SHARED_LIBS=ON \
  -DGGML_BACKEND_DL=ON \
  -DGGML_NATIVE=OFF \
  -DGGML_CUDA=ON \
  -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCHS" \
  -DWHISPER_BUILD_TESTS=OFF \
  -DWHISPER_BUILD_EXAMPLES=OFF \
  -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
  -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
  -DCMAKE_INSTALL_RPATH='$ORIGIN' >/dev/null
cmake --build "$BUILD_DIR" --target ggml-cuda -j "${JOBS:-$(nproc)}"

# `-not -path '*/stage/*'`: the previous run's copy lives under $STAGE, which is
# wiped below — matching it here would delete the file and then fail to copy it.
PLUGIN=$(find "$BUILD_DIR" -not -path '*/stage/*' -name 'libggml-cuda.so' -type f | head -1)
[ -n "$PLUGIN" ] || { echo "libggml-cuda.so was not produced" >&2; exit 1; }

STAGE="$BUILD_DIR/stage"
rm -rf "$STAGE" && mkdir -p "$STAGE"
cp -a "$PLUGIN" "$STAGE/"
for lib in libcudart libcublas libcublasLt; do
  src=$(ls "$CUDA_LIB/$lib.so.$CUDA_VER" 2>/dev/null | head -1)
  [ -n "$src" ] || { echo "missing $lib.so.$CUDA_VER in $CUDA_LIB" >&2; exit 1; }
  cp -aL "$src" "$STAGE/"
done

# The app loads the plugin only when this stamp equals its own `ggml_version()`:
# a plugin built against another ggml registers its device and then crashes.
GGML_VERSION=$(sed -nE 's/^set\(GGML_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)$/\2/p' "$SRC/ggml/CMakeLists.txt" | paste -sd.)
[[ "$GGML_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "could not read the ggml version from $SRC/ggml/CMakeLists.txt" >&2; exit 1; }
printf '%s\n' "$GGML_VERSION" > "$STAGE/ggml-version"

# Debug info in the plugin is dead weight in a download; NVIDIA's libraries
# arrive stripped already. nvprune cannot help with the rest: it only operates
# on relocatable device code, and the shipped cuBLAS objects are final.
strip --strip-unneeded "$STAGE/libggml-cuda.so" 2>/dev/null || true

# The whole scheme rests on this: without $ORIGIN the plugin cannot find the
# CUDA runtime sitting beside it, and dlopen fails at load.
if ! readelf -d "$STAGE/libggml-cuda.so" | grep -qE 'R(UN)?PATH.*\$ORIGIN'; then
  echo "libggml-cuda.so has no \$ORIGIN runpath — it would not resolve its CUDA runtime" >&2
  exit 1
fi

# Assert against the built binary, not the configure step. A GPU whose arch is
# absent from both the SASS and the PTX cannot run the plugin at all, and that
# is invisible until a user with that card tries it.
SASS=$(cuobjdump -lelf "$STAGE/libggml-cuda.so" 2>/dev/null | grep -oP 'sm_\K[0-9]+[a-z]*' | sort -u)
PTX=$(cuobjdump  -lptx "$STAGE/libggml-cuda.so" 2>/dev/null | grep -oP 'sm_\K[0-9]+[a-z]*' | sort -u)
MISSING=""
IFS=';' read -ra WANT <<< "$CUDA_ARCHS"
for arch in "${WANT[@]}"; do
  # ggml rewrites 12X into the architecture-specific 12Xa (Blackwell's FP4
  # tensor-core instructions are not forward-compatible), so a request for 120
  # is satisfied by sm_120a. Match the number and allow that suffix.
  case "$arch" in
    *-virtual) want="${arch%-virtual}"; have="$PTX"  ;;
    *)         want="${arch%-real}";    have="$SASS" ;;
  esac
  grep -qE "^${want%[a-z]}[a-z]?$" <<< "$have" || MISSING="$MISSING $arch"
done
[ -z "$MISSING" ] || { echo "plugin is missing requested architectures:$MISSING" >&2; exit 1; }
echo "verified SASS: $(echo $SASS | tr '\n' ' ') | PTX: $(echo $PTX | tr '\n' ' ')"

mkdir -p "$OUT"
NAME="lune-voice-gpu-cuda${CUDA_VER}-linux-x86_64"
tar -czf "$OUT/$NAME.tar.gz" -C "$STAGE" .
( cd "$OUT" && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )

echo
echo "  $OUT/$NAME.tar.gz  ($(du -h "$OUT/$NAME.tar.gz" | cut -f1))"
cat "$OUT/$NAME.tar.gz.sha256"
echo
echo "Upload both files to the GitHub release, then record the sha256 and the"
echo "byte size in CUDA_LINUX_X86_64 (crates/lune-persist/src/gpu_plugin.rs)"
echo "so the download is verified."
'''
info = "Build + package the downloadable CUDA backend plugin for GitHub Releases (--env CUDA_ARCHS=... to narrow)"

[scripts.gpu-plugin-windows]
interpreter = "bash"
command = '''
set -euo pipefail
# Build the downloadable CUDA backend plugin for Windows and package it.
#
# Run this ON Windows, from Git Bash or an MSYS shell, in a terminal where the
# MSVC toolchain is on PATH (a "Developer Command Prompt", or after running
# vcvars64.bat). CUDA device code cannot be cross-compiled from Linux — nvcc
# targets the host toolchain — so there is no Linux path to this artifact.
#
# The archive stays a .tar.gz, matching Linux, so both platforms share one
# verified extractor in `lune-persist::gpu_plugin`. Only the member names
# differ, which is what its allowlist switches on.
#
# Windows has no $ORIGIN: a DLL loaded by full path resolves its imports from
# the EXE directory, System32 and PATH, never from its own folder. The app
# compensates at load time (`preload_sibling_libraries` in lune-asr), so this
# script only has to put the right DLLs in the archive — there is no link-time
# runpath to assert, which is the one check the Linux script has and this
# one cannot.
OUT="${OUT:-release-artifacts}"
BUILD_DIR="${BUILD_DIR:-target/gpu-plugin-windows}"
SRC="vendor/whisper-rs-sys/whisper.cpp"
# `CUDA_PATH` is set by the CUDA toolkit installer.
CUDA_ROOT="${CUDA_PATH:-}"
# Same architecture set as the Linux plugin; see that script for why compute_75
# PTX is the floor.
CUDA_ARCHS="${CUDA_ARCHS:-75-real;86-real;89-real;120-real;75-virtual}"

command -v cmake >/dev/null || { echo "cmake is required" >&2; exit 1; }
command -v nvcc  >/dev/null || { echo "the CUDA toolkit (nvcc) is required" >&2; exit 1; }
[ -d "$SRC" ] || { echo "missing $SRC" >&2; exit 1; }
[ -n "$CUDA_ROOT" ] || { echo "CUDA_PATH is not set — run from a shell where the CUDA toolkit is configured" >&2; exit 1; }
CUDA_BIN="$CUDA_ROOT/bin"
[ -d "$CUDA_BIN" ] || { echo "no bin directory under CUDA_PATH ($CUDA_ROOT)" >&2; exit 1; }

# Same trap as the Linux script: CMake caches CMAKE_CUDA_ARCHITECTURES, so a
# reused build directory silently keeps producing the narrower plugin.
CACHED_ARCHS=$(grep -oP '^CMAKE_CUDA_ARCHITECTURES:[^=]*=\K.*' "$BUILD_DIR/CMakeCache.txt" 2>/dev/null || true)
if [ -n "$CACHED_ARCHS" ] && [ "$CACHED_ARCHS" != "$CUDA_ARCHS" ]; then
  echo "CUDA architectures changed ($CACHED_ARCHS -> $CUDA_ARCHS); reconfiguring"
  rm -rf "$BUILD_DIR"
fi

# The runtime DLLs carry their major version in the file name (cudart64_13.dll),
# which is also how the app's archive allowlist recognises them.
CUDART=$(ls "$CUDA_BIN"/cudart64_*.dll 2>/dev/null | head -1)
[ -n "$CUDART" ] || { echo "no cudart64_*.dll in $CUDA_BIN" >&2; exit 1; }
CUDA_VER=$(basename "$CUDART" | sed -E 's/cudart64_([0-9]+)\.dll/\1/')
[ -n "$CUDA_VER" ] || { echo "could not determine the CUDA runtime version from $CUDART" >&2; exit 1; }
echo "Building CUDA $CUDA_VER backend plugin for archs $CUDA_ARCHS"

cmake -S "$SRC" -B "$BUILD_DIR" \
  -DCMAKE_BUILD_TYPE=Release \
  -DBUILD_SHARED_LIBS=ON \
  -DGGML_BACKEND_DL=ON \
  -DGGML_NATIVE=OFF \
  -DGGML_CUDA=ON \
  -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCHS" \
  -DWHISPER_BUILD_TESTS=OFF \
  -DWHISPER_BUILD_EXAMPLES=OFF >/dev/null
cmake --build "$BUILD_DIR" --config Release --target ggml-cuda -j "${JOBS:-$(nproc)}"

# MSVC generators put artifacts under a per-configuration directory; Ninja does
# not. Search rather than assume which generator CMake picked.
# `-not -path '*/stage/*'`: the previous run's copy lives under $STAGE, which is
# wiped below — matching it here would delete the file and then fail to copy it.
PLUGIN=$(find "$BUILD_DIR" -not -path '*/stage/*' -name 'ggml-cuda.dll' -type f | head -1)
[ -n "$PLUGIN" ] || { echo "ggml-cuda.dll was not produced" >&2; exit 1; }

STAGE="$BUILD_DIR/stage"
rm -rf "$STAGE" && mkdir -p "$STAGE"
cp -a "$PLUGIN" "$STAGE/"
# cublas needs cublasLt; both are redistributable under the CUDA EULA, as is
# cudart. nvcuda.dll is the *driver* and is not ours to ship.
for lib in cudart cublas cublasLt; do
  src=$(ls "$CUDA_BIN/${lib}64_$CUDA_VER.dll" 2>/dev/null | head -1)
  [ -n "$src" ] || { echo "missing ${lib}64_$CUDA_VER.dll in $CUDA_BIN" >&2; exit 1; }
  cp -a "$src" "$STAGE/"
done

# Same stamp as the Linux plugin: the app refuses a plugin without it.
GGML_VERSION=$(sed -nE 's/^set\(GGML_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)$/\2/p' "$SRC/ggml/CMakeLists.txt" | paste -sd.)
[[ "$GGML_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "could not read the ggml version from $SRC/ggml/CMakeLists.txt" >&2; exit 1; }
printf '%s\n' "$GGML_VERSION" > "$STAGE/ggml-version"

# The app refuses any archive member outside its allowlist, so a stray file
# here becomes a failed install for every user. Check it now instead.
for f in "$STAGE"/*; do
  base=$(basename "$f")
  case "$base" in
    ggml-cuda.dll|cudart64_*.dll|cublas64_*.dll|cublasLt64_*.dll|ggml-version) ;;
    *) echo "unexpected file in the archive: $base" >&2; exit 1 ;;
  esac
done

if command -v cuobjdump >/dev/null; then
  # Assert against the built binary, not the configure step: a GPU whose arch is
  # in neither the SASS nor the PTX cannot run the plugin, and that stays
  # invisible until a user with that card tries it.
  SASS=$(cuobjdump -lelf "$STAGE/ggml-cuda.dll" 2>/dev/null | grep -oP 'sm_\K[0-9]+[a-z]*' | sort -u)
  PTX=$(cuobjdump  -lptx "$STAGE/ggml-cuda.dll" 2>/dev/null | grep -oP 'sm_\K[0-9]+[a-z]*' | sort -u)
  MISSING=""
  IFS=';' read -ra WANT <<< "$CUDA_ARCHS"
  for arch in "${WANT[@]}"; do
    # ggml rewrites 12X into 12Xa; match the number and allow that suffix.
    case "$arch" in
      *-virtual) want="${arch%-virtual}"; have="$PTX"  ;;
      *)         want="${arch%-real}";    have="$SASS" ;;
    esac
    grep -qE "^${want%[a-z]}[a-z]?$" <<< "$have" || MISSING="$MISSING $arch"
  done
  [ -z "$MISSING" ] || { echo "plugin is missing requested architectures:$MISSING" >&2; exit 1; }
  echo "verified SASS: $(echo $SASS | tr '\n' ' ') | PTX: $(echo $PTX | tr '\n' ' ')"
else
  echo "WARNING: cuobjdump not found — architecture coverage was NOT verified" >&2
fi

mkdir -p "$OUT"
NAME="lune-voice-gpu-cuda${CUDA_VER}-windows-x86_64"
tar -czf "$OUT/$NAME.tar.gz" -C "$STAGE" .
( cd "$OUT" && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )

echo
echo "  $OUT/$NAME.tar.gz  ($(du -h "$OUT/$NAME.tar.gz" | cut -f1))"
cat "$OUT/$NAME.tar.gz.sha256"
echo
echo "Upload both files to the GitHub release, then record the sha256 and the"
echo "byte size in CUDA_WINDOWS_X86_64 (crates/lune-persist/src/gpu_plugin.rs)"
echo "and update the_cuda_windows_release_is_still_unpublished in that file."
'''
info = "Build + package the downloadable CUDA backend plugin for Windows (run on Windows; --env CUDA_ARCHS=... to narrow)"

# ── Tools ────────────────────────────────────────────────────────────────────

[scripts.vad-inspect]
interpreter = "bash"
command = '''
if [ -z "$WAV" ]; then echo "Usage: cgs run vad-inspect --env WAV=path/to/file.wav"; exit 1; fi
cargo run --release -p lune-audio --example vad_inspect -- "$WAV"
'''
info = "VAD timeline analysis on a WAV file (--env WAV=path)"

[scripts.record]
command = "uv run scripts/dev/record_mic.py"
info = "Record mic to float32 WAV (16kHz mono)"
requires = ["uv"]

[scripts.updater-test]
interpreter = "bash"
command = '''
bash scripts/dev/updater-test.sh
'''
info = "End-to-end updater test on localhost: builds two AppImages and serves a signed manifest (--env KEEP=1, PORT=)"

[scripts.updater-manifest]
interpreter = "bash"
command = '''
bash scripts/release/updater-manifest.sh "${TAG:?set --env TAG=v0.2.0}"
'''
info = "Sign the release artifacts and write release-artifacts/latest.json for the updater (--env TAG=v0.2.0)"

[scripts.licenses]
interpreter = "bash"
command = '''
bash scripts/release/third-party-licenses.sh ${CHECK:+--check}
'''
info = "Regenerate THIRD_PARTY_LICENSES.md from the Rust and JS dependency trees (--env CHECK=1 to only verify it)"

[scripts.desktop-entry]
interpreter = "bash"
command = '''
bash scripts/dev/desktop-entry.sh
'''
info = "Install a user desktop entry so a build-tree binary gets a window icon on Wayland (--env PROFILE=debug, --env REMOVE=1)"

[scripts.package]
interpreter = "bash"
command = '''
bash scripts/release/package-all.sh "${TYPE:-all}"
'''
info = "Build the distributable Linux artifacts in one Ubuntu 22.04 container into release-artifacts/: .deb, .AppImage, .rpm and a portable .tar.gz (--env TYPE=all|bundles|tarball)"

# ── CI / composite ──────────────────────────────────────────────────────────

[scripts.ci]
include = ["fmt", "clippy", "check", "test"]
info = "Full CI: fmt + clippy + check + test"

# ── Cleanup ──────────────────────────────────────────────────────────────────

[scripts.clean]
interpreter = "bash"
command = '''
cargo clean
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
if [ "$ALL" = "1" ]; then
  rm -rf .venv
  echo "cleaned target/ + __pycache__ + .venv"
else
  echo "cleaned target/ + __pycache__"
fi
'''
info = "Clean build artifacts (--env ALL=1 includes .venv)"

