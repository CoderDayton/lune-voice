[global_env]
RUST_BACKTRACE = "1"

[scripts]

[scripts.list]
interpreter = "bash"
command = '''
cgs show
'''
info = "List all available scripts"

# ── Desktop UI ──────────────────────────────────────────────────────────────

[scripts.dev]
interpreter = "bash"
# Dev app needs the native backends compiled in, otherwise the ASR/LLM stubs
# return "backend not compiled in" and dictation fails. `default = []` keeps
# routine `cargo check` toolchain-light, so the features are passed here
# explicitly (mirroring `cgs build`). BACKEND auto-detects: if unset, a CUDA
# build is used when both nvcc and nvidia-smi are present, else CPU. Force
# either with `--env BACKEND=cpu|cuda`. Unlike release builds GGML_NATIVE is
# left on so the dev build tunes for THIS machine's CPU.
command = '''
cd desktop-ui
BACKEND="${BACKEND:-}"
if [ -z "$BACKEND" ]; then
  if command -v nvcc >/dev/null 2>&1 && command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
    BACKEND=cuda
  else
    BACKEND=cpu
  fi
fi
case "$BACKEND" in
  cpu)  FEATURES="whisper-cpp llama-cpp" ;;
  cuda) FEATURES="whisper-cuda llama-cuda" ;;
  *)    echo "BACKEND must be cpu|cuda"; exit 1 ;;
esac
echo "Dev ($BACKEND): --features \"$FEATURES\""
bun tauri dev --features "$FEATURES"
'''
info = "Launch Tauri app in dev mode (hot-reload; CUDA auto-detected, --env BACKEND=cpu|cuda to force)"
requires = ["bun"]

# ── Quick iteration ──────────────────────────────────────────────────────────

[scripts.check]
command = "cargo check --workspace"
info = "Type-check all crates"

[scripts.clippy]
command = "cargo clippy --workspace -- -D warnings"
info = "Lint with clippy (deny warnings)"

[scripts.fmt]
interpreter = "bash"
command = '''
if [ "$FIX" = "1" ]; then cargo fmt --all; else cargo fmt --all --check; fi
'''
info = "Check formatting (--env FIX=1 to apply)"

# ── Testing ──────────────────────────────────────────────────────────────────

[scripts.test]
command = "cargo test --workspace"
info = "Run unit tests (no real models)"

[scripts.test-e2e]
interpreter = "bash"
command = '''
cargo test -p lune-app --test e2e_pipeline -- --nocapture
'''
info = "Run lightweight app pipeline integration tests"

# ── Benchmarks ───────────────────────────────────────────────────────────────

[scripts.bench]
interpreter = "bash"
# Real-pipeline benchmarks. Model-backed ones build whisper.cpp + llama.cpp and
# need a model on disk; CUDA features auto-detect (mirrors cgs build/dev).
# `transcribe` runs the whole capture→AGC→VAD→whisper(+styling) pipeline on a
# WAV/f32/dir and prints the hypothesis — the GUI-free way to test ASR quality.
command = '''
TYPE="${TYPE:-agc}"
if command -v nvcc >/dev/null 2>&1 && command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
  FEATURES="whisper-cuda llama-cuda"
else
  FEATURES="whisper-cpp llama-cpp"
fi
[ -d /lib/x86_64-linux-gnu ] && export LIBCLANG_PATH="${LIBCLANG_PATH:-/lib/x86_64-linux-gnu}"
run() { cargo run --release --example "$1" -p lune-app --features "$FEATURES" "${@:2}"; }
case "$TYPE" in
  agc)         cargo run --release --example agc_bench -p lune-audio ;;
  transcribe)  [ -z "$WAV" ] && { echo "set --env WAV=path (.wav/.f32/dir)"; exit 1; }; run asr_probe -- "$WAV" ;;
  domain)      run bench_domain ;;
  pipeline)    run pipeline_real ;;
  stages)      run pipeline_stages ;;
  latency)     run session_latency ;;
  punctuation) run punctuation_ab ;;
  dict)        run dict_carrier_ab ;;
  styling)     run styling_capability ;;
  rulecmp)     run styling_rulecmp ;;
  live)        run live_transcribe ;;
  *) echo "TYPE must be: agc | transcribe(WAV=) | domain | pipeline | stages | latency | punctuation | dict | styling | rulecmp | live"; exit 1 ;;
esac
'''
info = "Benchmarks (--env TYPE=agc|transcribe|domain|pipeline|stages|latency|punctuation|dict|styling|live; transcribe needs WAV=)"

# ── Build ────────────────────────────────────────────────────────────────────

[scripts.build]
interpreter = "bash"
# Desktop app: `tauri build` does the release Rust compile + UI build + bundle
# in one step, compiling whisper.cpp + llama.cpp into the binary (users never
# compile anything — this produces the artifact they'd run).
#
# TWO build profiles:
#   • Default (NATIVE): `GGML_NATIVE=ON` tunes ggml to THIS machine's CPU and,
#     for CUDA, only the build host's GPU arch (e.g. sm_89). The CUDA compile is
#     ~8x smaller and won't exhaust RAM. The binary runs great here but is NOT
#     portable to other CPUs/GPUs. This is the right local build.
#   • PORTABLE (`--env PORTABLE=1`): a distributable artifact — portable AVX2 CPU
#     baseline + every common NVIDIA CUDA arch. Much heavier: ggml compiles ~8
#     CUDA archs, so build on a runner with plenty of RAM (or cap CARGO_BUILD_JOBS
#     to avoid OOM). This is what release/CI uses per target.
#
# Backend AUTO-DETECTS: if `BACKEND` is unset and both nvcc and a working
# nvidia-smi are present, CUDA is built; otherwise CPU. Force with
# `--env BACKEND=cpu|cuda`. macOS Metal and the full release matrix: docs/RELEASE.md.
# Build host needs: cmake, a C++ toolchain, and libclang (for bindgen); plus the
# CUDA toolkit for a `cuda` build.
command = '''
cd desktop-ui
BACKEND="${BACKEND:-}"
if [ -z "$BACKEND" ]; then
  if command -v nvcc >/dev/null 2>&1 && command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
    BACKEND=cuda
  else
    BACKEND=cpu
  fi
fi
case "$BACKEND" in
  cpu)  FEATURES="whisper-cpp llama-cpp" ;;
  cuda) FEATURES="whisper-cuda llama-cuda" ;;
  *)    echo "BACKEND must be cpu|cuda (macOS Metal: see docs/RELEASE.md)"; exit 1 ;;
esac
if [ -n "${PORTABLE:-}" ]; then
  # Distributable: portable AVX2 CPU baseline + every common NVIDIA CUDA arch (~8).
  # Bundles per tauri.conf.json (deb, rpm, appimage).
  GGML_FLAGS="GGML_NATIVE=OFF GGML_AVX2=ON GGML_FMA=ON GGML_F16C=ON"
  BUNDLE_ARGS=""
  echo "Building PORTABLE $BACKEND release: --features \"$FEATURES\""
else
  # Local (default): native to this machine — ggml targets only the build host's
  # CPU and GPU arch, so the CUDA compile stays small and won't exhaust RAM.
  # Only deb + appimage: rpm bundling xz-compresses the (large) CUDA binary and
  # is slow + useless on Debian/Pop!_OS. Override with `--env BUNDLES="deb"` etc.
  GGML_FLAGS="GGML_NATIVE=ON"
  BUNDLE_ARGS="--bundles ${BUNDLES:-deb appimage}"
  echo "Building NATIVE $BACKEND build (this machine only): --features \"$FEATURES\""
fi
env $GGML_FLAGS APPIMAGE_EXTRACT_AND_RUN=1 bun tauri build --features "$FEATURES" $BUNDLE_ARGS
'''
info = "Desktop app — native to this machine (CUDA auto-detected). --env PORTABLE=1 for a distributable build; --env BACKEND=cpu|cuda to force. See docs/RELEASE.md"
requires = ["bun"]

# ── Tools ────────────────────────────────────────────────────────────────────

[scripts.vad-inspect]
interpreter = "bash"
command = '''
if [ -z "$WAV" ]; then echo "Usage: cgs run vad-inspect --env WAV=path/to/file.wav"; exit 1; fi
cargo run --release -p lune-audio --example vad_inspect -- "$WAV"
'''
info = "VAD timeline analysis on a WAV file (--env WAV=path)"

[scripts.record]
command = "uv run scripts/dev/record_mic.py"
info = "Record mic to float32 WAV (16kHz mono)"
requires = ["uv"]

[scripts.package]
interpreter = "bash"
command = '''
bash scripts/release/package-all.sh "${TYPE:-all}"
'''
info = "Build .deb/.AppImage/.rpm via Docker (--env TYPE=all|deb-appimage|rpm)"

# ── CI / composite ──────────────────────────────────────────────────────────

[scripts.ci]
include = ["fmt", "clippy", "check", "test"]
info = "Full CI: fmt + clippy + check + test"

# ── Cleanup ──────────────────────────────────────────────────────────────────

[scripts.clean]
interpreter = "bash"
command = '''
cargo clean
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
if [ "$ALL" = "1" ]; then
  rm -rf .venv
  echo "cleaned target/ + __pycache__ + .venv"
else
  echo "cleaned target/ + __pycache__"
fi
'''
info = "Clean build artifacts (--env ALL=1 includes .venv)"

