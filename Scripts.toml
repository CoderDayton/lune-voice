[global_env]
RUST_BACKTRACE = "1"

[scripts]

[scripts.list]
interpreter = "bash"
command = '''
cgs show
'''
info = "List all available scripts"

# ── Desktop UI ──────────────────────────────────────────────────────────────

[scripts.dev]
interpreter = "bash"
command = '''
. scripts/dev/pick-backend.sh
cd desktop-ui
GGML_FLAGS="GGML_BACKEND_DL=ON GGML_NATIVE=OFF GGML_CPU_ALL_VARIANTS=ON"
# Host-tuned Rust codegen for the dev build. Opt-in here rather than pinned in
# `.cargo/config.toml`, so a plain `cargo build` stays portable.
export RUSTFLAGS="${RUSTFLAGS:--C target-cpu=native}"
echo "Dev ($BACKEND): --features \"$FEATURES\" ($GGML_FLAGS)"
env $GGML_FLAGS bun tauri dev --features "$FEATURES"
'''
info = "Launch Tauri app in dev mode (hot-reload; Vulkan when glslc, the Vulkan headers and SPIRV-Headers are found, else CPU; --env BACKEND=cpu|vulkan to force)"
requires = ["bun"]

# ── Quick iteration ──────────────────────────────────────────────────────────

[scripts.check]
command = "cargo check --workspace"
info = "Type-check all crates"

[scripts.clippy]
command = "cargo clippy --workspace -- -D warnings"
info = "Lint with clippy (deny warnings)"

# The whole workspace type-checked for Windows from this Linux box, so the
# `cfg(target_os = "windows")` halves of the platform split cannot rot between
# pushes. `lune-ui` is included: `tauri_build` compiles the icon/manifest
# resource with binutils' `x86_64-w64-mingw32-windres`, wired to a `zig cc`
# preprocessor by `.cargo/config.toml`. It reads `desktop-ui/dist`, so run
# `bun run build` in `desktop-ui/` first on a fresh clone.
#
# Check only, never build: the C toolchain comes from `zig cc` via
# `.cargo/config.toml`, and linking would additionally need a MinGW `gcc` as the
# linker driver.
[scripts.check-windows]
interpreter = "bash"
command = '''
if ! command -v zig >/dev/null 2>&1; then
  echo "zig not found — install it (the C cross-compiler for this check)"; exit 1
fi
if ! command -v x86_64-w64-mingw32-windres >/dev/null 2>&1; then
  echo "x86_64-w64-mingw32-windres not found — install binutils-mingw-w64-x86-64 (lune-ui's resource compiler)"; exit 1
fi
if ! rustup target list --installed | grep -qx x86_64-pc-windows-gnu; then
  echo "adding the x86_64-pc-windows-gnu rust target"
  rustup target add x86_64-pc-windows-gnu
fi
cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
'''
info = "Cross-check the whole workspace for Windows (needs zig + mingw binutils)"
requires = ["zig", "rustup"]

[scripts.fmt]
interpreter = "bash"
command = '''
if [ "$FIX" = "1" ]; then cargo fmt --all; else cargo fmt --all --check; fi
'''
info = "Check formatting (--env FIX=1 to apply)"

# ── Testing ──────────────────────────────────────────────────────────────────

[scripts.test]
interpreter = "bash"
# `cargo test --workspace` builds example targets but does NOT run the tests
# inside them, so the benchmark metric and baseline-gate tests in
# benchmarks/bench_utils.rs need the explicit `--examples` pass. Examples with
# `required-features` are skipped there, so this stays toolchain-light.
command = '''
set -e
cargo test --workspace
cargo test -p lune-voice --examples
'''
info = "Run unit tests, including the benchmark helpers (no real models)"

[scripts.test-e2e]
interpreter = "bash"
command = '''
cargo test -p lune-voice --test e2e_pipeline -- --nocapture
'''
info = "Run lightweight app pipeline integration tests"

# ── Benchmarks ───────────────────────────────────────────────────────────────

[scripts.bench]
interpreter = "bash"
# Real-pipeline benchmarks. Model-backed ones build whisper.cpp and need a
# model on disk; the styling pass talks to a remote OpenAI-compatible endpoint
# (LUNE_BENCH_LLM_* env vars). Backend pick: scripts/dev/pick-backend.sh.
# `transcribe` runs the whole capture→AGC→VAD→whisper(+styling) pipeline on a
# WAV/f32/dir and prints the hypothesis — the GUI-free way to test ASR quality.
command = '''
TYPE="${TYPE:-agc}"
. scripts/dev/pick-backend.sh
[ -d /lib/x86_64-linux-gnu ] && export LIBCLANG_PATH="${LIBCLANG_PATH:-/lib/x86_64-linux-gnu}"
run() { cargo run --release --example "$1" -p lune-voice --features "$FEATURES" "${@:2}"; }
case "$TYPE" in
  agc)         cargo run --release --example agc_bench -p lune-audio ;;
  transcribe)  [ -z "$WAV" ] && { echo "set --env WAV=path (.wav/.f32/dir)"; exit 1; }; run asr_probe -- "$WAV" ;;
  domain)      run bench_domain ;;
  pipeline)    run pipeline_real ;;
  stages)      run pipeline_stages ;;
  latency)     run session_latency ;;
  vram)        run vram_probe ;;
  modelload)   run model_load ;;
  punctuation) run punctuation_ab ;;
  dict)        run dict_carrier_ab ;;
  leadin)      run lead_in_ab ;;
  snippets)    cargo run --release --example snippet_bench -p lune-voice ;;
  styling)     run styling_capability ;;
  rulecmp)     run styling_rulecmp ;;
  live)        run live_transcribe ;;
  confusion)   run confusion_mine ;;
  noisify)     run noisify_fixtures ;;
  livewer)     run live_bench ;;
  *) echo "TYPE must be: agc | transcribe(WAV=) | domain | pipeline | stages | latency | vram | modelload | punctuation | dict | leadin | snippets | styling | rulecmp | live | livewer | confusion | noisify"; exit 1 ;;
esac
'''
info = "Benchmarks (--env TYPE=agc|transcribe|domain|pipeline|stages|latency|vram|modelload|punctuation|dict|leadin|snippets|styling|rulecmp|live|livewer|confusion|noisify; transcribe needs WAV=). TYPE=leadin scores opening-word errors per lead-in policy (--env LUNE_BENCH_DIR=dir of your own .wav+.txt clips). TYPE=modelload times cold/warm model load and unload per whisper model (--env REPEATS=n, DEVICE=cpu|vulkan). TYPE=vram measures device memory across dictation toggles and a model swap (NVIDIA only; --env CYCLES=n). Pin the model with --env WHISPER_MODEL=small|medium|large. TYPE=domain gates on a baseline: --env LUNE_BENCH_JSON=out.json to record, --env LUNE_BENCH_BASELINE=base.json to fail on regression (--env LUNE_BENCH_TOLERANCE=pts, default 1.0)"

# ── Build ────────────────────────────────────────────────────────────────────

[scripts.build]
interpreter = "bash"
# Desktop app: `tauri build` does the release Rust compile + UI build + bundle
# in one step, compiling whisper.cpp into the binary (users never compile
# anything — this produces the artifact they'd run).
#
# TWO build profiles:
#   • Default (NATIVE): a static build with `GGML_NATIVE=ON`, tuned to THIS
#     machine's CPU. The binary runs great here but is NOT portable to other
#     CPUs. The right local build.
command = '''
# Compile only. The shippable installers are `cgs package`, which builds them in
# containers against an old glibc so they install on other distros — a bundle
# made here links this machine's libraries and is not distributable. Pass
# --env BUNDLE=1 to bundle locally anyway, for testing the .deb layout itself.
if [ -n "${BUNDLE:-}" ]; then
  BUNDLE_ARGS="--bundles ${BUNDLES:-deb appimage}"
else
  BUNDLE_ARGS="--no-bundle"
fi
if [ -n "${PORTABLE:-}" ]; then
  if [ "${BACKEND:-cpu}" != "cpu" ]; then
    echo "PORTABLE builds are CPU only; GPU ships as the Vulkan plugin (cgs gpu-plugin)"; exit 1
  fi
  APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/release/build-bundles.sh $BUNDLE_ARGS
  exit $?
fi
. scripts/dev/pick-backend.sh
cd desktop-ui
GGML_FLAGS="GGML_NATIVE=ON"
# Host-tuned Rust codegen to match GGML_NATIVE. This is opt-in per build
# rather than pinned in `.cargo/config.toml`, so a plain `cargo build
# --release` stays portable.
export RUSTFLAGS="${RUSTFLAGS:--C target-cpu=native}"
echo "Building NATIVE $BACKEND build (this machine only): --features \"$FEATURES\" RUSTFLAGS=\"$RUSTFLAGS\""
env $GGML_FLAGS APPIMAGE_EXTRACT_AND_RUN=1 bun tauri build --features "$FEATURES" $BUNDLE_ARGS
'''
info = "Compile the desktop app, no installers — native to this machine (Vulkan when glslc, the Vulkan headers and SPIRV-Headers are found, else CPU). --env PORTABLE=1 for the distributable CPU build; --env BACKEND=cpu|vulkan to force; --env BUNDLE=1 to also bundle locally. Installers: cgs package. See docs/RELEASE.md"
requires = ["bun"]

[scripts.stage-runtime]
interpreter = "bash"
command = '''
set -euo pipefail
# Assemble the runtime layout a GGML_BACKEND_DL build needs beside the binary:
#
#   <bin dir>/libwhisper.so.1, libparakeet.so.1,
#             libggml.so.0, libggml-base.so.0                      (DT_NEEDED)
#   <bin dir>/backends/libggml-cpu-*.so, libggml-vulkan.so       (dlopen-ed)
#
# The executable carries RUNPATH=$ORIGIN (desktop-ui/src-tauri/build.rs), so the
# core libraries resolve from its own directory with no LD_LIBRARY_PATH.
PROFILE="${PROFILE:-debug}"
BIN_DIR="target/$PROFILE"
# Cargo keeps two `whisper-rs-sys-*` directories — the compiled build script and
# the directory its run produced — and only the latter has `out/lib`. Newest
# first, but filtered, so a freshly recompiled build script cannot shadow the
# real output and make this look like an unbuilt tree.
SRC_DIR=""
for d in $(ls -dt target/$PROFILE/build/whisper-rs-sys-*/ 2>/dev/null || true); do
  if [ -d "$d/out/lib" ]; then SRC_DIR="$d"; break; fi
done

if [ -z "$SRC_DIR" ] || [ ! -d "$SRC_DIR/out/lib" ]; then
  echo "no whisper-rs-sys build output under target/$PROFILE — build with the whisper-cpp feature first" >&2
  exit 1
fi
if ! ls "$SRC_DIR"/out/lib/libggml-base.so* >/dev/null 2>&1; then
  echo "whisper-rs-sys built static libraries — rebuild with GGML_BACKEND_DL=ON" >&2
  exit 1
fi

# The test harness runs binaries from target/<profile>/deps, so stage there too.
mkdir -p "$BIN_DIR/backends" "$BIN_DIR/deps/backends"
for dest in "$BIN_DIR" "$BIN_DIR/deps"; do
  cp -a "$SRC_DIR"/out/lib/libwhisper.so* "$SRC_DIR"/out/lib/libparakeet.so* \
    "$SRC_DIR"/out/lib/libggml*.so* "$dest/"
  cp -a "$SRC_DIR"/out/bin/libggml-cpu-*.so "$dest/backends/"
  if [ -e "$SRC_DIR/out/bin/libggml-vulkan.so" ]; then
    cp -a "$SRC_DIR/out/bin/libggml-vulkan.so" "$dest/backends/"
  fi
done

COUNT=$(ls "$BIN_DIR"/backends | wc -l)
if [ -e "$BIN_DIR/backends/libggml-vulkan.so" ]; then
  echo "staged $COUNT backend plugins into $BIN_DIR/backends (CPU + vulkan)"
else
  echo "staged $COUNT backend plugins into $BIN_DIR/backends (CPU only — build with whisper-vulkan for GPU)"
fi
'''
info = "Copy the ggml shared libraries and backend plugins (CPU, plus Vulkan when built) next to the built binary (--env PROFILE=release)"

[scripts.gpu-plugin]
interpreter = "bash"
command = '''
bash scripts/release/gpu-plugin-vulkan.sh
'''
info = "Build + package the downloadable Vulkan backend plugin for this OS (needs VULKAN_SDK; on Windows run from Git Bash)"

# ── Tools ────────────────────────────────────────────────────────────────────

[scripts.vad-inspect]
interpreter = "bash"
command = '''
if [ -z "$WAV" ]; then echo "Usage: cgs run vad-inspect --env WAV=path/to/file.wav"; exit 1; fi
cargo run --release -p lune-audio --example vad_inspect -- "$WAV"
'''
info = "VAD timeline analysis on a WAV file (--env WAV=path)"

[scripts.record]
command = "uv run scripts/dev/record_mic.py"
info = "Record mic to float32 WAV (16kHz mono)"
requires = ["uv"]

[scripts.updater-test]
interpreter = "bash"
command = '''
bash scripts/dev/updater-test.sh
'''
info = "End-to-end updater test on localhost: builds two AppImages and serves a signed manifest (--env KEEP=1, PORT=)"

[scripts.updater-manifest]
interpreter = "bash"
command = '''
bash scripts/release/updater-manifest.sh "${TAG:?set --env TAG=v0.2.0}"
'''
info = "Sign the release artifacts and write release-artifacts/latest.json for the updater (--env TAG=v0.2.0)"

[scripts.licenses]
interpreter = "bash"
command = '''
bash scripts/release/third-party-licenses.sh ${CHECK:+--check}
'''
info = "Regenerate THIRD_PARTY_LICENSES.md from the Rust and JS dependency trees (--env CHECK=1 to only verify it)"

[scripts.desktop-entry]
interpreter = "bash"
command = '''
bash scripts/dev/desktop-entry.sh
'''
info = "Install a user desktop entry so a build-tree binary gets a window icon on Wayland (--env PROFILE=debug, --env REMOVE=1)"

[scripts.package]
interpreter = "bash"
command = '''
bash scripts/release/package-all.sh "${TYPE:-all}"
'''
info = "Build the distributable Linux artifacts in one Ubuntu 22.04 container into release-artifacts/: .deb, .AppImage, .rpm and a portable .tar.gz (--env TYPE=all|bundles|tarball)"

# ── CI / composite ──────────────────────────────────────────────────────────

[scripts.ci]
include = ["fmt", "clippy", "check", "test"]
info = "Full CI: fmt + clippy + check + test"

# ── Cleanup ──────────────────────────────────────────────────────────────────

[scripts.clean]
interpreter = "bash"
command = '''
cargo clean
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null
if [ "$ALL" = "1" ]; then
  rm -rf .venv
  echo "cleaned target/ + __pycache__ + .venv"
else
  echo "cleaned target/ + __pycache__"
fi
'''
info = "Clean build artifacts (--env ALL=1 includes .venv)"

