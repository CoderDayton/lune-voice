pre-commit:
  parallel: false
  commands:
    fmt:
      # Check-only (no --write): never modifies or stages files, so lefthook
      # doesn't stash unstaged changes. stage_fixed auto-staging was what forced
      # the stash/restore — which could orphan a `lefthook auto backup` and drop
      # work if interrupted. On failure, run `cargo fmt --all` (or `cgs fmt
      # --env FIX=1`) and restage.
      run: cargo fmt --all --check
      fail_text: "formatting needed — run `cargo fmt --all` then restage"

    spdx:
      run: bash scripts/dev/check-spdx.sh
      fail_text: "a source file lacks its SPDX line — add `SPDX-License-Identifier: GPL-3.0-or-later` in a comment at the top"

    check:
      run: CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-4} cargo check --workspace --all-targets
      fail_text: "cargo check failed — fix compilation errors"

    clippy:
      run: CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-2} cargo clippy --workspace --lib --bins -- -D warnings
      fail_text: "cargo clippy failed — fix Rust lint warnings"

    test:
      run: CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-2} cargo test --workspace --lib --bins
      fail_text: "Rust unit and binary tests failed"

    dto-drift:
      # ts-rs regenerates desktop-ui/src/lib/backend/generated/ during the
      # `test` step above. If any of those files differ from HEAD, a Rust DTO
      # was edited without committing the regenerated TypeScript bindings.
      run: |
        if ! git diff --quiet -- desktop-ui/src/lib/backend/generated/; then
          echo "DTO bindings drifted — stage the regenerated files:"
          git --no-pager diff --stat -- desktop-ui/src/lib/backend/generated/
          exit 1
        fi
      fail_text: "DTO bindings drift — run `cargo test -p lune-ui` and stage the regenerated files in desktop-ui/src/lib/backend/generated/"

    frontend-lint:
      run: cd desktop-ui && bunx @biomejs/biome check src/
      fail_text: "frontend lint failed — run `bunx @biomejs/biome check --write src/` to fix"

    frontend-test:
      run: cd desktop-ui && bun run test
      fail_text: "frontend tests failed — fix desktop UI regressions"


pre-push:
  parallel: false
  commands:
    clippy:
      # Default features (stubs) — deliberately NOT --all-features, which turns
      # on `whisper-vulkan` and source-compiles whisper.cpp with the Vulkan
      # backend (needs glslc, the Vulkan headers and SPIRV-Headers on every
      # pushing machine). Routine gates stay
      # toolchain-light on stubs by design; the real native backends are built and
      # exercised by `cgs build` / `cgs ci`, which is where feature-gated backend
      # code gets compiled. --all-targets still lints tests/benches/examples,
      # adding coverage over the pre-commit `--lib --bins` clippy.
      run: CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-2} cargo clippy --workspace --all-targets -- -D warnings
      fail_text: "Fix clippy warnings before pushing"

    test:
      run: CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-1} cargo test --workspace
      fail_text: "Tests must pass before pushing"

    frontend-build:
      # build:ci = tsc + vite build, WITHOUT `lingui extract --clean`. Extract
      # mutates the committed src/locales/ catalogs (a dev action, not a push
      # gate) and has wedged at 100% CPU on push; the vite lingui plugin compiles
      # the already-committed .po catalogs at build time, so the gate doesn't need it.
      run: cd desktop-ui && bun run build:ci
      fail_text: "Desktop UI build failed"

    e2e-models:
      run: |
        if [ "${LUNE_E2E_MODELS:-0}" != "1" ]; then
          echo "Skipping real-model E2E tests (set LUNE_E2E_MODELS=1 to enable)"
          exit 0
        fi
        CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-1} cargo test -p lune-llm --test smoke_ort_llm --test kv_cache_integration -- --ignored --nocapture
      fail_text: "Real-model E2E tests failed"

    audit:
      run: |
        if cargo audit --version >/dev/null 2>&1; then
          cargo audit 2>&1 | tail -5
        else
          echo "cargo-audit not installed, skipping (install: cargo install cargo-audit)"
        fi
      fail_text: "Security vulnerabilities found — run `cargo audit` for details"
