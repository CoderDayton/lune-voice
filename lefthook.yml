pre-commit:
  parallel: false
  commands:
    fmt:
      run: cargo fmt --all -- --check
      fail_text: "Run `cargo fmt --all` to fix formatting"

    check:
      run: CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-4} cargo check --workspace --all-targets
      fail_text: "cargo check failed — fix compilation errors"

pre-push:
  commands:
    clippy:
      run: |
        if [ "${LUNE_FULL_CLIPPY:-0}" != "1" ]; then
          echo "Skipping full clippy (set LUNE_FULL_CLIPPY=1 to enable)"
          exit 0
        fi
        CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-1} cargo clippy --workspace --all-targets --all-features -- -D warnings
      fail_text: "Fix clippy warnings before pushing"

    test:
      run: CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-1} cargo test --workspace --lib --bins
      fail_text: "Tests must pass before pushing"

    audit:
      run: |
        if cargo audit --version &>/dev/null 2>&1; then
          cargo audit
        else
          echo "cargo-audit not installed, skipping (install: cargo install cargo-audit)"
        fi
      fail_text: "Security vulnerabilities found — run `cargo audit` for details"
