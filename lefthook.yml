pre-commit:
  parallel: true
  commands:
    fmt:
      run: cargo fmt --all -- --check
      fail_text: "Run `cargo fmt --all` to fix formatting"

    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      fail_text: "Fix clippy warnings before committing"

    check:
      run: cargo check --workspace --all-targets
      fail_text: "cargo check failed — fix compilation errors"

pre-push:
  commands:
    test:
      run: cargo test --workspace
      fail_text: "Tests must pass before pushing"

    audit:
      run: |
        if cargo audit --version &>/dev/null 2>&1; then
          cargo audit
        else
          echo "cargo-audit not installed, skipping (install: cargo install cargo-audit)"
        fi
      fail_text: "Security vulnerabilities found — run `cargo audit` for details"
