[package]
name = "lune-ui"
version = "0.1.0"
edition = "2024"
default-run = "lune-ui"

[features]
default = []
cuda = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lune-app = { path = "../../crates/lune-app" }
lune-asr = { path = "../../crates/lune-asr" }
lune-commands = { path = "../../crates/lune-commands" }
lune-core = { path = "../../crates/lune-core" }
lune-dict = { path = "../../crates/lune-dict" }
lune-llm = { path = "../../crates/lune-llm" }
lune-persist = { path = "../../crates/lune-persist" }
ort = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true
regex = "1.12.3"
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[[bin]]
name = "lune-ui"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
