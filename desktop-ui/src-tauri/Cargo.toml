[package]
name = "lune-ui"
version = "0.1.0"
edition = "2024"
license.workspace = true
default-run = "lune-voice"

[lints]
workspace = true

[features]
default = []
# Native backends are compiled into the shipped app by `cgs build`. Off by
# default so routine checks need no C++ toolchain; `gpu` (CUDA) is added by
# `cgs build` when the build host has a CUDA toolchain.
whisper-cpp = ["lune-voice/whisper-cpp"]
whisper-cuda = ["lune-voice/whisper-cuda"]
whisper-vulkan = ["lune-voice/whisper-vulkan"]
gpu = ["lune-voice/gpu"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "test", "tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
lune-voice = { path = "../../crates/lune-voice" }
lune-asr = { path = "../../crates/lune-asr" }
lune-audio = { path = "../../crates/lune-audio" }
lune-core = { path = "../../crates/lune-core" }
lune-dict = { path = "../../crates/lune-dict" }
lune-llm = { path = "../../crates/lune-llm" }
lune-persist = { path = "../../crates/lune-persist" }
uuid.workspace = true
# Resolving the user's local midnight for the today-scoped session stats.
chrono.workspace = true
tokio = { workspace = true }
# Feedback relay POSTs to the proxy that fronts the chat webhook (feedback.rs).
reqwest = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
url.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-updater = "2.10.1"
ts-rs = { version = "12", features = ["serde-compat"] }
mimalloc.workspace = true
tauri-plugin-notification = "2.3.3"

# Low-level keyboard hook for the global hotkey (src/hotkey_windows/hook.rs).
# `windows-sys` is already in the tree transitively, so this adds no new crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
evdev.workspace = true
# `umask` for process-wide file-permission hardening (main.rs).
libc.workspace = true

[[bin]]
name = "lune-voice"
path = "src/main.rs"
