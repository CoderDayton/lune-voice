[package]
name = "lune-ui"
version = "0.1.0"
edition = "2024"
default-run = "lune-ui"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "lune-ui"
path = "src/main.rs"
