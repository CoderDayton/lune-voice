# Deliberately empty of `rustflags`.
#
# Host-tuned codegen (`-C target-cpu=native`) is opt-in, not the default: a
# committed `build.rustflags` applies to every `cargo build` in this repo,
# including a packager's plain `cargo build --release`, and the resulting binary
# SIGILLs on any CPU older than the build host. `cgs dev` and the native branch
# of `cgs build` export `RUSTFLAGS=-C target-cpu=native` for themselves; the
# PORTABLE branch exports the `x86-64-v3` baseline instead.

# C toolchain for the Windows cross-check (`cgs check-windows`), so the whole
# workspace can be type-checked for Windows from a Linux box. `zig cc` stands in
# for MinGW; the shims translate the target triple cc-rs passes. `RC_*` is the
# resource compiler `lune-ui` needs for its icon and manifest — binutils'
# `windres`, with `zig cc` supplying the C preprocessor it would otherwise take
# from a MinGW gcc. Read only when `--target x86_64-pc-windows-gnu` is in play,
# and overridable from the environment, so a machine with a real MinGW toolchain
# can use it.
#
# `cargo check` only. Linking that target additionally needs a MinGW `gcc` as
# the linker driver, so no `linker` is configured here — building a Windows
# binary is CI's job (`windows-latest`).
[env]
CC_x86_64_pc_windows_gnu = { value = "scripts/dev/zig-cc-windows.sh", relative = true, force = false }
CXX_x86_64_pc_windows_gnu = { value = "scripts/dev/zig-cc-windows.sh", relative = true, force = false }
AR_x86_64_pc_windows_gnu = { value = "scripts/dev/zig-ar-windows.sh", relative = true, force = false }
RC_x86_64_pc_windows_gnu = { value = "scripts/dev/windres-windows.sh", relative = true, force = false }
