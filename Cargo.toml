[workspace]
resolver = "3"
members = [
    "crates/lune-core",
    "crates/lune-audio",
    "crates/lune-asr",
    "crates/lune-llm",
    "crates/lune-dict",
    "crates/lune-persist",
    "crates/lune-app",
    "desktop-ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
# thin LTO: ~80% of fat's benefit at fraction of link time; cross-crate inlining
# unlocked across all 9 crates. codegen-units=1 removes parallelism barriers so
# LLVM sees the full call graph. panic=abort removes unwind tables (~5% binary size).
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "debuginfo"

[profile.bench]
# Benchmarks need debug symbols for flamegraphs; inherit release settings otherwise.
inherits = "release"
strip = "none"
debug = true

# Optimize dependencies even in dev builds. The workspace's own crates stay at
# opt-level 0 for fast incremental builds and clean backtraces, while heavy
# dependencies (ONNX Runtime wrapper, ndarray, audio, sampler math) compile
# optimized — closing most of the dev-vs-release speed gap so local inference
# doesn't trip the LLM timeout fallback.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
# Internal crates
lune-core = { path = "crates/lune-core" }
lune-audio = { path = "crates/lune-audio" }
lune-asr = { path = "crates/lune-asr" }
lune-llm = { path = "crates/lune-llm" }
lune-dict = { path = "crates/lune-dict" }
lune-persist = { path = "crates/lune-persist" }

# Async & runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# Error handling
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Data types
uuid = { version = "1", features = ["v4", "serde"] }

# Cross-platform I/O
arboard = "3.6"
enigo = "0.6.1"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"
diesel = { version = "2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2"
dirs = "6"
cpal = "0.17"
rubato = "1.0.1"
audioadapter-buffers = "2"
mimalloc = { version = "0.1", default-features = false }
ort = { version = "2.0.0-rc.12", features = ["ndarray", "std", "download-binaries", "copy-dylibs", "tls-native", "half", "api-18"], default-features = false }
ndarray = "0.17"
rustfft = "6.4"
hf-hub = "0.5"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
async-openai = { version = "0.33", features = ["chat-completion"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
zbus = "5"
evdev = "0.13"
smallvec = { version = "1", features = ["union"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
