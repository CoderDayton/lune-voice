[workspace]
resolver = "3"
members = [
    "crates/lune-core",
    "crates/lune-audio",
    "crates/lune-asr",
    "crates/lune-llm",
    "crates/lune-output",
    "crates/lune-commands",
    "crates/lune-dict",
    "crates/lune-persist",
    "crates/lune-app",
    "ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
# thin LTO: ~80% of fat's benefit at fraction of link time; cross-crate inlining
# unlocked across all 9 crates. codegen-units=1 removes parallelism barriers so
# LLVM sees the full call graph. panic=abort removes unwind tables (~5% binary size).
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "debuginfo"

[profile.bench]
# Benchmarks need debug symbols for flamegraphs; inherit release settings otherwise.
inherits = "release"
strip = "none"
debug = true

[workspace.dependencies]
# Internal crates
lune-core = { path = "crates/lune-core" }
lune-audio = { path = "crates/lune-audio" }
lune-asr = { path = "crates/lune-asr" }
lune-llm = { path = "crates/lune-llm" }
lune-output = { path = "crates/lune-output" }
lune-commands = { path = "crates/lune-commands" }
lune-dict = { path = "crates/lune-dict" }
lune-persist = { path = "crates/lune-persist" }

# Async & runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Data types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"
diesel = { version = "2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2"
dirs = "6"
cpal = "0.15"
rubato = "1.0.1"
audioadapter-buffers = "2"
mimalloc = { version = "0.1", default-features = false }
ort = { version = "2.0.0-rc.11", features = ["ndarray", "std", "download-binaries", "copy-dylibs", "tls-native", "half"], default-features = false }
ndarray = "0.17"
rustfft = "6.4"
hf-hub = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
async-openai = { version = "0.33", features = ["chat-completion"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
zbus = "5"
evdev = "0.13"
