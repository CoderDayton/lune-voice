[workspace]
resolver = "3"
members = [
    "crates/lune-core",
    "crates/lune-audio",
    "crates/lune-asr",
    "crates/lune-llm",
    "crates/lune-dict",
    "crates/lune-persist",
    "crates/lune-voice",
    "desktop-ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/CoderDayton/lune-voice"
homepage = "https://github.com/CoderDayton/lune-voice"

# Vendored fork of `whisper-rs-sys` 0.15.0, carrying whisper.cpp v1.9.4. Three
# files differ from upstream — `build.rs`, `src/lib.rs` and
# `whisper.cpp/src/whisper.cpp`; every change is marked `LUNE FORK`.
# Upstream pins `BUILD_SHARED_LIBS=OFF` and decides the link kind from the
# `intel-sycl` feature, which makes ggml's dlopen-able backends
# (`GGML_BACKEND_DL`) impossible to build. The fork routes both off that one
# switch so the CUDA backend can ship as a downloadable plugin instead of a
# hard `DT_NEEDED` on the CUDA runtime. See docs/GPU_PLUGIN.md.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
# thin LTO: ~80% of fat's benefit at fraction of link time; cross-crate inlining
# unlocked across all 8 members. codegen-units=1 removes parallelism barriers so
# LLVM sees the full call graph.
#
# Unwinding (the default), deliberately, despite `panic = "abort"` being worth
# ~5% of binary size: the session task has a supervisor that catches a panicked
# dictation, reports it, releases the mic and closes the history row
# (`lune-voice/src/session.rs`). Aborting turns one bad utterance into the app
# vanishing mid-sentence, and that supervisor into dead code. A panic crossing
# an `extern "C"` boundary still aborts, which is what the ggml callbacks need.
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "debuginfo"

[profile.bench]
# Benchmarks need debug symbols for flamegraphs; inherit release settings otherwise.
inherits = "release"
strip = "none"
debug = true

# Optimize dependencies even in dev builds. The workspace's own crates stay at
# opt-level 0 for fast incremental builds and clean backtraces, while heavy
# dependencies (whisper.cpp bindings, audio capture and resampling, SQLite)
# compile optimized — closing most of the dev-vs-release speed gap so local
# inference doesn't trip the LLM timeout fallback.
[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
# Internal crates
lune-core = { path = "crates/lune-core" }
lune-audio = { path = "crates/lune-audio" }
lune-asr = { path = "crates/lune-asr" }
lune-llm = { path = "crates/lune-llm" }
lune-dict = { path = "crates/lune-dict" }
lune-persist = { path = "crates/lune-persist" }

# Async & runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# Error handling
thiserror = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Data types
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1.12"

# Hashing / encoding (model + GPU-plugin archive verification)
sha2 = "0.11"
hex = "0.4"

# Cross-platform I/O
# `wayland-data-control` (Linux-only, target-gated dep) lets arboard advertise
# the `x-kde-passwordManagerHint` exclusion MIME alongside the pasted text so
# transient dictation pastes stay out of clipboard-history managers — the CLI
# `wl-copy`/`xclip` serve only a single target and can't co-advertise it.
arboard = { version = "3.6", features = ["wayland-data-control"] }
enigo = "0.6.1"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"
diesel = { version = "2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2"
dirs = "6"
cpal = "0.18"
rubato = "5.0"
audioadapter-buffers = "5"
mimalloc = { version = "0.1", default-features = false }
hound = "3.5"
async-openai = { version = "0.41", features = ["chat-completion", "middleware"] }
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
# Streaming + unpacking the downloadable GPU backend archive
# (crates/lune-persist/src/gpu_plugin.rs).
tar = "0.4"
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zbus = "5"
evdev = "0.13"
# `dlopen` for NVIDIA-driver detection (crates/lune-asr/src/gpu_backend.rs).
libc = "0.2"
# Win32 shells of the platform-split subsystems. Each crate adds only the
# feature modules it calls; cargo unions them.
windows-sys = "0.61"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# `staging` supplies the `ext_foreign_toplevel_list` / `ext_workspace`
# interfaces that the vendored COSMIC toplevel-info XML references.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Proc-macro codegen for that vendored XML — see lune-voice/src/cosmic_protocol.rs.
wayland-scanner = "0.31"
# Referenced by the code `wayland-scanner` emits.
wayland-backend = "0.3"

# Test-only
tempfile = "3"
